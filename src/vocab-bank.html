<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Bank</title>
<meta name="description" content="A simple vocab bank: type a phrase, pick a topic, and it is filed as a bullet under that topic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ec;--card:#fff;--ink:#0f1b2d;--muted:#6b7686;--line:#eceadf;--accent:#2563eb;--soft:#eceffc;--soft-line:#dde3f8;--jpt-bar:68px}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
button,input{font-family:inherit}
button{cursor:pointer}

.main-inner{padding:20px 24px 48px;max-width:960px;margin:0 auto}

/* Entry row */
.vb-entry{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 20px 44px -34px rgba(30,50,110,.35)}
.vb-entry input{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:11px 18px;outline:none;min-width:0;transition:border-color .12s}
.vb-entry input:focus{border-color:var(--accent);background:var(--card)}
#vbTopic{flex:0 1 220px}
#vbPhrase{flex:1 1 260px}
.vb-add{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;padding:11px 22px;
  border-radius:999px;border:none;background:var(--accent);color:#fff;transition:background .12s}
.vb-add:hover{background:var(--accent-deep,#1d4ed8)}
.vb-add svg{width:15px;height:15px}
.vb-hint{font-size:12px;color:var(--muted);margin:8px 4px 0}

/* Toolbar */
.vb-bar{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.vb-count{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700;flex:1}
.vb-search{font-size:13px;border:1px solid var(--soft-line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 16px;outline:none;width:200px;max-width:100%}
.vb-search:focus{border-color:var(--accent)}
.vb-cloud{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 14px;
  border-radius:999px;border:1px solid var(--soft-line);background:transparent;color:var(--muted);transition:.12s}
.vb-cloud:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.vb-cloud svg{width:15px;height:15px;flex-shrink:0}
.vb-cloud i{width:8px;height:8px;border-radius:50%;background:#9aa3b2;flex-shrink:0}
.vb-cloud.ok i{background:#2f9e5b}
.vb-cloud.busy i{background:#d9a21b}
.vb-cloud.err i{background:#c14343}
.vb-ghost{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--soft-line);
  background:transparent;color:var(--muted);transition:.12s}
.vb-ghost:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}

/* Topic cards */
.vb-grid{columns:2 300px;column-gap:14px}
.vb-group{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px 12px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.vb-ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-width:0}
.vb-gname{font-size:15px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.vb-gnum{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 9px}
#vbType{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:11px 14px;outline:none;flex:0 1 150px;cursor:pointer}
#vbType:focus{border-color:var(--accent);background:var(--card)}
.vb-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.vb-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--soft-line);
  background:transparent;color:var(--muted);transition:.12s}
.vb-chip:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.vb-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vb-copy{opacity:.55;width:26px;height:26px;flex-shrink:0;border-radius:999px;border:none;background:transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.vb-copy svg{width:14px;height:14px}
.vb-copy:hover,.vb-copy:focus-visible{opacity:1;background:var(--soft);color:var(--accent)}
.vb-copy.done{opacity:1;color:#2f9e5b}
.vb-subrow{display:flex;align-items:center;gap:6px;margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.vb-subrow .vb-sub{margin:0;padding:0;border:none;flex:1}
.vb-subrow .vb-copy{width:22px;height:22px}
.vb-subrow .vb-copy svg{width:12px;height:12px}
.vb-bulk{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.vb-bulk.open{display:block}
.vb-bulk textarea{width:100%;min-height:150px;resize:vertical;font-family:inherit;font-size:14.5px;line-height:1.5;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.vb-bulk textarea:focus{border-color:var(--accent);background:var(--card)}
.vb-bulk-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.vb-bulk-note{font-size:12px;color:var(--muted);flex:1;min-width:200px}
.vb-sub{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.vb-sub:first-of-type{margin-top:6px}
.vb-list{list-style:disc;margin:0;padding-left:20px}
.vb-list li{font-size:14.5px;line-height:1.45;padding:3px 0;overflow-wrap:anywhere}
.vb-list li::marker{color:var(--accent)}
.vb-item{display:flex;align-items:flex-start;gap:6px}
.vb-text{flex:1;min-width:0;border-radius:6px;outline:none}
.vb-text:focus{background:var(--soft);box-shadow:0 0 0 3px var(--soft)}
.vb-ty{opacity:0;max-width:92px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);
  border:1px solid var(--line);border-radius:999px;padding:2px 6px;outline:none;cursor:pointer;flex-shrink:0;transition:.12s}
.vb-list li:hover .vb-ty,.vb-ty:focus{opacity:1}
.vb-ty:hover,.vb-ty:focus{border-color:var(--accent);color:var(--accent)}
@media (hover:none){.vb-ty{opacity:.7}}
.vb-x{opacity:0;width:22px;height:22px;flex-shrink:0;border-radius:999px;border:none;background:transparent;
  color:var(--muted);font-size:16px;line-height:1;transition:.12s}
.vb-list li:hover .vb-x,.vb-x:focus-visible{opacity:1}
.vb-x:hover{background:#fbe9e9;color:#c14343}
@media (hover:none){.vb-x{opacity:.6}}
.vb-gdel{opacity:0;width:26px;height:26px;border-radius:999px;border:none;background:transparent;color:var(--muted);transition:.12s;font-size:15px}
.vb-group:hover .vb-gdel,.vb-gdel:focus-visible{opacity:1}
@media (hover:none){.vb-gdel{opacity:.6}}
.vb-gdel:hover{background:#fbe9e9;color:#c14343}
.vb-empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;
  background:var(--card);border:1px dashed var(--soft-line);border-radius:16px}
@media (max-width:560px){.main-inner{padding:16px 14px 34px}.vb-grid{columns:1}.vb-search{width:100%}}
</style>
</head>
<body>

<div class="app" id="app">
  <main>
    <div class="main-inner">

      <form class="vb-entry" id="vbForm" autocomplete="off">
        <input id="vbTopic" list="vbTopics" placeholder="Topic (e.g. Travel)" aria-label="Topic" maxlength="60">
        <datalist id="vbTopics"></datalist>
        <select id="vbType" aria-label="Type"></select>
        <input id="vbPhrase" placeholder="Type a word or phrase, press Enter" aria-label="Vocab phrase" maxlength="200">
        <button class="vb-add" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </form>
      <div class="vb-hint">The topic and type stay filled in, so you can keep adding to the same group. Click any phrase to edit it.</div>

      <div class="vb-bulk" id="vbBulk">
        <textarea id="vbBulkText" placeholder="Paste a list, one phrase per line.&#10;&#10;Travel:&#10;off the beaten track&#10;to hit the road&#10;&#10;Work:&#10;to meet a deadline" aria-label="Bulk paste"></textarea>
        <div class="vb-bulk-row">
          <div class="vb-bulk-note">Uses the topic and type above. A line ending in a colon starts a new topic. Bullets and numbers are stripped.</div>
          <button class="vb-ghost" id="vbBulkCancel" type="button">Cancel</button>
          <button class="vb-add" id="vbBulkAdd" type="button">Add all</button>
        </div>
      </div>

      <div class="vb-bar">
        <div class="vb-count" id="vbCount"></div>
        <input class="vb-search" id="vbSearch" placeholder="Search phrases" aria-label="Search phrases">
        <button class="vb-ghost" id="vbBulkBtn" type="button">Bulk paste</button>
        <button class="vb-cloud" id="vbCloud" type="button" title="Your bank saves to the cloud automatically. Click to sync now.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          <span id="vbCloudTxt">Cloud</span><i></i>
        </button>
        <button class="vb-cloud" id="vbAuto" type="button" title="Let Claude pick the type for each phrase you add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
          <span id="vbAutoTxt">Auto-sort</span><i></i>
        </button>
        <button class="vb-ghost" id="vbExport" type="button">Back up</button>
        <button class="vb-ghost" id="vbImport" type="button">Restore</button>
        <input type="file" id="vbFile" accept="application/json,.json" hidden>
      </div>

      <div class="vb-filters" id="vbFilters"></div>

      <div class="vb-grid" id="vbGrid"></div>

    </div>
  </main>
</div>

<script>
(function(){
  var KEY = 'jpt_vocab_bank_v1';
  var TYPES = ['Idiom','Phrasal verb','Collocation','Verb','Noun','Adjective','Adverb','Phrase','Other'];
  var bank = [];
  var typeFilter = '';   // [{id, topic, phrases:[{id, text}]}]

  var $ = function(id){ return document.getElementById(id); };
  var form = $('vbForm'), topicEl = $('vbTopic'), phraseEl = $('vbPhrase'), grid = $('vbGrid');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function load(){
    try { var d = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(d)) bank = d; } catch(e){ bank = []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(bank)); localStorage.setItem(KEY + '_t', String(Date.now())); } catch(e){}
    schedulePush();
  }

  // ── Cloud sync ────────────────────────────────────────────────────────
  // One row in the shared `lessons` table (id 'vocab-bank'), last write wins by timestamp.
  // Every change is saved locally first, then pushed after a short pause.
  var SB_URL = 'https://uovqsqnxcgvefxpxntcj.supabase.co/rest/v1/lessons';
  var SB_KEY = 'sb_publishable_VTOzRUebaH_xQAs4wngfug_jCVCeCFB';
  var ROW = 'vocab-bank';
  var pushTimer = null, pulled = false;
  function sbHeaders(extra){
    var h = {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'};
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function status(kind, txt){
    var b = $('vbCloud'); b.className = 'vb-cloud ' + kind; $('vbCloudTxt').textContent = txt;
  }
  function localT(){ try { return Number(localStorage.getItem(KEY + '_t')) || 0; } catch(e){ return 0; } }
  function schedulePush(){
    if (!pulled) return;   // never overwrite the cloud before we have seen what is in it
    status('busy', 'Saving…');
    clearTimeout(pushTimer); pushTimer = setTimeout(push, 700);
  }
  function push(){
    var t = localT() || Date.now();
    return fetch(SB_URL, {method: 'POST',
      headers: sbHeaders({Prefer: 'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify({id: ROW, data: {bank: bank, t: t}, updated_at: new Date().toISOString()})})
      .then(function(r){ if (!r.ok) throw new Error(r.status); status('ok', 'Saved to cloud'); })
      .catch(function(){ status('err', 'Not synced, saved on this device'); });
  }
  function pull(){
    status('busy', 'Syncing…');
    return fetch(SB_URL + '?id=eq.' + ROW + '&select=data', {headers: sbHeaders()})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(rows){
        pulled = true;
        var c = rows[0] && rows[0].data;
        var cb = c && Array.isArray(c.bank) ? c.bank : null, ct = c ? Number(c.t) || 0 : 0, lt = localT();
        if (!cb){ if (bank.length) return push(); status('ok', 'Saved to cloud'); return; }
        if (lt === 0 && bank.length){
          // Phrases entered before cloud sync existed: fold them into the cloud copy, never overwrite it.
          var local = bank; bank = cb;
          local.forEach(function(g){ g.phrases.forEach(function(p){ add(g.topic, p.text, p.type); }); });
          render(); return push();
        }
        if (ct > lt){
          bank = cb;
          try { localStorage.setItem(KEY, JSON.stringify(bank)); localStorage.setItem(KEY + '_t', String(ct)); } catch(e){}
          render(); status('ok', 'Saved to cloud');
        } else if (lt > ct) return push();
        else status('ok', 'Saved to cloud');
      })
      .catch(function(){ status('err', 'Offline, saved on this device'); });
  }
  $('vbCloud').addEventListener('click', function(){ if (!pulled) pull(); else { clearTimeout(pushTimer); status('busy', 'Saving…'); push(); } });
  function findTopic(name){
    var k = name.trim().toLowerCase();
    for (var i = 0; i < bank.length; i++) if (bank[i].topic.toLowerCase() === k) return bank[i];
    return null;
  }

  function typeOf(p){ return TYPES.indexOf(p.type) > -1 ? p.type : 'Phrase'; }

  var COPY_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  function typeOpts(cur){ return TYPES.map(function(t){ return '<option' + (t === cur ? ' selected' : '') + '>' + t + '</option>'; }).join(''); }

  function add(topic, text, type){
    topic = topic.trim(); text = text.trim();
    if (!text) return false;
    if (!topic) topic = 'General';
    var g = findTopic(topic);
    if (!g){ g = {id: uid(), topic: topic, phrases: []}; bank.push(g); }
    type = TYPES.indexOf(type) > -1 ? type : 'Phrase';
    if (!g.phrases.some(function(p){ return p.text.toLowerCase() === text.toLowerCase() && typeOf(p) === type; }))
      g.phrases.push({id: uid(), text: text, type: type});
    save();
    return true;
  }

  function render(){
    var q = $('vbSearch').value.trim().toLowerCase();
    var total = 0, html = '';
    bank.forEach(function(g){
      total += g.phrases.length;
      var shown = g.phrases.filter(function(p){
        return (!typeFilter || typeOf(p) === typeFilter) &&
          (!q || p.text.toLowerCase().indexOf(q) > -1 || g.topic.toLowerCase().indexOf(q) > -1 || typeOf(p).toLowerCase().indexOf(q) > -1); });
      if ((q || typeFilter) && !shown.length) return;
      html += '<section class="vb-group" data-g="' + g.id + '"><div class="vb-ghead">' +
        '<span class="vb-gname">' + esc(g.topic) + '</span><span class="vb-gnum">' + g.phrases.length + '</span>' +
        '<button class="vb-copy" type="button" data-copyg="' + g.id + '" title="Copy this topic" aria-label="Copy this topic">' + COPY_ICO + '</button>' +
        '<button class="vb-gdel" type="button" data-delg="' + g.id + '" title="Delete topic" aria-label="Delete topic">&#10005;</button></div>';
      TYPES.forEach(function(ty){
        var items = shown.filter(function(p){ return typeOf(p) === ty; });
        if (!items.length) return;
        html += '<div class="vb-subrow"><div class="vb-sub">' + esc(ty === 'Other' ? ty : ty + 's') +
          '</div><button class="vb-copy" type="button" data-copyg="' + g.id + '" data-copyt="' + esc(ty) + '" title="Copy these ' + esc(ty.toLowerCase()) + 's" aria-label="Copy section">' + COPY_ICO + '</button></div><ul class="vb-list">' + items.map(function(p){
          return '<li><span class="vb-item"><span class="vb-text" contenteditable="plaintext-only" spellcheck="false" data-p="' + p.id + '" data-g="' + g.id + '">' +
            esc(p.text) + '</span><select class="vb-ty" data-p="' + p.id + '" data-g="' + g.id + '" title="Change type" aria-label="Change type">' + typeOpts(typeOf(p)) + '</select><button class="vb-x" type="button" data-delp="' + p.id + '" data-g="' + g.id + '" title="Remove" aria-label="Remove phrase">&times;</button></span></li>';
        }).join('') + '</ul>';
      });
      html += '</section>';
    });
    grid.innerHTML = html || '<div class="vb-empty">' + (bank.length ? 'No phrases match your search.' :
      'Nothing here yet. Type a topic and a phrase above, then press Enter.') + '</div>';
    $('vbCount').textContent = total + (total === 1 ? ' phrase' : ' phrases') + ' in ' + bank.length + (bank.length === 1 ? ' topic' : ' topics');
    var used = {}; bank.forEach(function(g){ g.phrases.forEach(function(p){ used[typeOf(p)] = 1; }); });
    if (typeFilter && !used[typeFilter]) typeFilter = '';
    $('vbFilters').innerHTML = Object.keys(used).length < 2 ? '' :
      ['All'].concat(TYPES.filter(function(t){ return used[t]; })).map(function(t){
        var on = (t === 'All' && !typeFilter) || t === typeFilter;
        return '<button type="button" class="vb-chip' + (on ? ' on' : '') + '" data-type="' + (t === 'All' ? '' : esc(t)) + '">' + esc(t) + '</button>'; }).join('');
    $('vbTopics').innerHTML = bank.map(function(g){ return '<option value="' + esc(g.topic) + '">'; }).join('');
  }

  // ── Auto-sort ─────────────────────────────────────────────────────────
  // With your own Anthropic key (stored only in this browser, never synced or backed up)
  // Claude picks the type. Without one, a few simple rules cover verbs, phrasal verbs,
  // adverbs and adjectives and everything else lands under Phrases.
  var AKEY = KEY + '_apikey';
  function getKey(){ try { return localStorage.getItem(AKEY) || ''; } catch(e){ return ''; } }
  function paintAuto(){
    var on = !!getKey(); $('vbAuto').className = 'vb-cloud' + (on ? ' ok' : '');
    $('vbAutoTxt').textContent = on ? 'Auto-sort on' : 'Auto-sort';
  }
  var PARTS = 'up|down|out|off|on|in|over|away|back|through|around|into|after|along|apart|by|for|with|across|ahead|aside|forward|together';
  function guessType(text){
    var t = text.trim().toLowerCase();
    if (new RegExp('^to \\w+(\\s(' + PARTS + '))+(\\s\\w+){0,2}$').test(t) && t.split(/\s+/).length <= 4) return 'Phrasal verb';
    if (/^to [a-z-]+$/.test(t)) return 'Verb';
    if (/^[a-z-]+ly$/.test(t)) return 'Adverb';
    if (/^[a-z-]{4,}(ous|ful|ive|able|ible|less|ic|ish|ent|ant)$/.test(t)) return 'Adjective';
    return 'Phrase';
  }
  function askClaude(topic, text){
    return fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': getKey(), 'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: 'claude-haiku-5-5', max_tokens: 12,
        messages: [{role: 'user', content: 'Classify this English vocabulary item for a language learner. Topic: "' + topic +
          '". Item: "' + text + '". Answer with exactly one of: ' + TYPES.join(', ') +
          '. Idiom = figurative fixed expression. Collocation = words that naturally go together. Phrase = other useful chunk, sentence frame or short expression. Reply with the label only.'}]})})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        var out = (d.content && d.content[0] && d.content[0].text || '').trim().toLowerCase();
        for (var i = 0; i < TYPES.length; i++) if (out.indexOf(TYPES[i].toLowerCase()) === 0) return TYPES[i];
        throw new Error('unrecognised');
      });
  }
  function retype(topic, text, type){
    var g = findTopic(topic); if (!g) return;
    var p = g.phrases.filter(function(x){ return x.text === text && typeOf(x) === 'Phrase'; })[0];
    if (!p || type === 'Phrase') return;
    p.type = type;
    g.phrases = g.phrases.filter(function(x){ return x === p || !(x.text.toLowerCase() === text.toLowerCase() && typeOf(x) === type); });
    save(); render();
  }
  function autoSort(topic, text){
    if (!getKey()){ retype(topic, text, guessType(text)); return Promise.resolve(); }
    return askClaude(topic, text).then(function(ty){ retype(topic, text, ty); })
      .catch(function(){ retype(topic, text, guessType(text)); });
  }
  $('vbAuto').addEventListener('click', function(){
    var cur = getKey(), k;
    try { k = prompt('Paste your Anthropic API key to let Claude sort phrases by type.\n' +
      'It is stored only in this browser. Leave empty to turn it off.\nGet one at console.anthropic.com/settings/keys', cur); } catch(e){ return; }
    if (k === null) return;
    k = k.trim();
    try { if (k) localStorage.setItem(AKEY, k); else localStorage.removeItem(AKEY); } catch(e){}
    paintAuto();
    if (k && k !== cur){
      var todo = [];
      bank.forEach(function(g){ g.phrases.forEach(function(p){ if (typeOf(p) === 'Phrase') todo.push([g.topic, p.text]); }); });
      if (todo.length && confirm('Sort your ' + todo.length + ' existing phrases filed under Phrases too?')){
        var chain = Promise.resolve();
        todo.forEach(function(it){ chain = chain.then(function(){ return autoSort(it[0], it[1]); }); });
      }
    }
  });
  paintAuto();

  $('vbType').innerHTML = ['Auto'].concat(TYPES).map(function(t){ return '<option>' + t + '</option>'; }).join('');
  $('vbType').value = 'Auto';
  try { var lt = localStorage.getItem(KEY + '_type'); if (lt && (lt === 'Auto' || TYPES.indexOf(lt) > -1)) $('vbType').value = lt; } catch(e){}
  $('vbType').addEventListener('change', function(){ try { localStorage.setItem(KEY + '_type', this.value); } catch(e){} });
  $('vbFilters').addEventListener('click', function(e){
    var c = e.target.closest('[data-type]'); if (!c) return; typeFilter = c.dataset.type; render(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var chosen = $('vbType').value, ptxt = phraseEl.value.trim(), ptopic = topicEl.value.trim() || 'General';
    if (add(topicEl.value, phraseEl.value, chosen === 'Auto' ? 'Phrase' : chosen)){
      if (chosen === 'Auto') autoSort(ptopic, ptxt);
      phraseEl.value = '';
      $('vbSearch').value = '';
      render();
    }
    phraseEl.focus();
  });

  function copyText(txt, btn){
    function ok(){ btn.classList.add('done'); setTimeout(function(){ btn.classList.remove('done'); }, 1200); }
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e){} ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  }
  function groupText(g, ty){
    var lines = [];
    if (ty){ lines.push(ty === 'Other' ? ty : ty + 's'); }
    else lines.push(g.topic);
    TYPES.forEach(function(t){
      if (ty && t !== ty) return;
      var items = g.phrases.filter(function(p){ return typeOf(p) === t; });
      if (!items.length) return;
      if (!ty) lines.push('', t === 'Other' ? t : t + 's');
      items.forEach(function(p){ lines.push('\u2022 ' + p.text); });
    });
    return lines.join('\n');
  }

  grid.addEventListener('click', function(e){
    var cp = e.target.closest('[data-copyg]');
    if (cp){
      var cg = bank.filter(function(x){ return x.id === cp.dataset.copyg; })[0];
      if (cg) copyText(groupText(cg, cp.dataset.copyt || ''), cp);
      return;
    }
    var dp = e.target.closest('[data-delp]'), dg = e.target.closest('[data-delg]');
    if (dp){
      var g = bank.filter(function(x){ return x.id === dp.dataset.g; })[0];
      if (g){ g.phrases = g.phrases.filter(function(p){ return p.id !== dp.dataset.delp; });
        if (!g.phrases.length) bank = bank.filter(function(x){ return x !== g; }); }
      save(); render();
    } else if (dg){
      var gg = bank.filter(function(x){ return x.id === dg.dataset.delg; })[0];
      if (gg && (gg.phrases.length < 2 || confirm('Delete "' + gg.topic + '" and its ' + gg.phrases.length + ' phrases?'))){
        bank = bank.filter(function(x){ return x !== gg; }); save(); render(); }
    }
  });

  grid.addEventListener('change', function(e){
    var el = e.target; if (!el.classList.contains('vb-ty')) return;
    var g = bank.filter(function(x){ return x.id === el.dataset.g; })[0]; if (!g) return;
    var p = g.phrases.filter(function(x){ return x.id === el.dataset.p; })[0]; if (!p) return;
    p.type = el.value;
    // Moving into a type that already holds the same phrase would duplicate it: merge.
    g.phrases = g.phrases.filter(function(x){
      return x === p || !(x.text.toLowerCase() === p.text.toLowerCase() && typeOf(x) === p.type); });
    save(); render();
  });

  // Inline editing: commit on blur or Enter; an emptied phrase is removed.
  grid.addEventListener('keydown', function(e){
    if (e.target.classList.contains('vb-text') && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
  });
  grid.addEventListener('focusout', function(e){
    var el = e.target; if (!el.classList || !el.classList.contains('vb-text')) return;
    var g = bank.filter(function(x){ return x.id === el.dataset.g; })[0]; if (!g) return;
    var p = g.phrases.filter(function(x){ return x.id === el.dataset.p; })[0]; if (!p) return;
    var t = el.textContent.trim();
    if (t === p.text) return;
    if (!t) g.phrases = g.phrases.filter(function(x){ return x !== p; }); else p.text = t;
    if (!g.phrases.length) bank = bank.filter(function(x){ return x !== g; });
    save(); render();
  });

  $('vbSearch').addEventListener('input', render);

  // ── Bulk paste ────────────────────────────────────────────────────────
  function toggleBulk(open){
    $('vbBulk').classList.toggle('open', open);
    if (open) $('vbBulkText').focus();
  }
  $('vbBulkBtn').addEventListener('click', function(){ toggleBulk(!$('vbBulk').classList.contains('open')); });
  $('vbBulkCancel').addEventListener('click', function(){ $('vbBulkText').value = ''; toggleBulk(false); });
  $('vbBulkAdd').addEventListener('click', function(){
    var topic = topicEl.value.trim() || 'General', chosen = $('vbType').value, items = [], added = 0;
    $('vbBulkText').value.split(/\r?\n/).forEach(function(line){
      line = line.replace(/^\s*(?:[-*\u2022\u2013]|\d+[.)])\s+/, '').trim();
      if (!line) return;
      if (/^[^:]{1,60}:$/.test(line)){ topic = line.slice(0, -1).trim(); return; }
      items.push([topic, line]);
    });
    items.forEach(function(it){ if (add(it[0], it[1], chosen === 'Auto' ? 'Phrase' : chosen)) added++; });
    if (!added) return;
    $('vbSearch').value = ''; render();
    $('vbBulkText').value = ''; toggleBulk(false);
    if (chosen === 'Auto'){
      var chain = Promise.resolve();
      items.forEach(function(it){ chain = chain.then(function(){ return autoSort(it[0], it[1]); }); });
    }
  });

  $('vbExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify({format: 'jpt-vocab-bank', version: 1, bank: bank}, null, 2)], {type: 'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'vocab-bank-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $('vbImport').addEventListener('click', function(){ $('vbFile').click(); });
  $('vbFile').addEventListener('change', function(){
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if (!d || d.format !== 'jpt-vocab-bank' || !Array.isArray(d.bank)) throw 0;
        d.bank.forEach(function(g){ (g.phrases || []).forEach(function(p){ add(String(g.topic || 'General'), String(p.text || ''), p.type); }); });
        render();
      } catch(e){ alert('That file is not a Vocab Bank backup.'); }
    };
    r.readAsText(f); this.value = '';
  });

  load(); render(); pull();
  window.vbAdd = function(t, p, ty){ add(t, p, ty); render(); };   // used by make_preview seeding
})();
</script>
</body>
</html>
