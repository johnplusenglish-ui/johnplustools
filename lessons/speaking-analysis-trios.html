    '<div class="hrow"><h1>' + esc(st.title) + '</h1><div class="hact">' +
      '<button type="button" class="chip" onclick="setTimer(' + st.min + ')">' + st.min + ':00</button>' +
      (canPresent ? '<button type="button" class="chip key" onclick="present()">Present</button>' : "") +
      '</div></div></div>' +
    (st.say ? '<div class="lead"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
      '<span>' + esc(st.say) + '</span></div>' : "") +
    body(st) + evHtml(st) +
    (nx ? '<div class="nextrow"><button type="button" class="nextb" onclick="next()">' +
      'Next: ' + esc(nx.title) + ' <span class="k">&#8594;</span></button></div>' : "") +
    '</div>';
  markImgs();
  justIn = false;
}
function render(){ renderSide(); renderMain(); }
function go(i){
  if(i < 0 || i >= STAGES.length) return;
  cur = i; justIn = !reduced();
  S.at = i; save();
  document.body.classList.remove("bankedit");
  setTimer(STAGES[cur].min);
  render(); closeSide();
  window.scrollTo({top:0, behavior: reduced() ? "auto" : "smooth"});
}
function next(){
  S.done[STAGES[cur].id] = true; save();
  if(cur < STAGES.length - 1) go(cur + 1); else render();
}
function prev(){ go(cur - 1); }
function goTest(i){
  if(i < 0 || i >= TESTS.length || i === T) return;
  useTest(i);
  cur = (typeof S.at === "number" && S.at >= 0 && S.at < STAGES.length) ? S.at : 0;
  justIn = !reduced();
  document.body.classList.remove("bankedit");
  loadNames();
  setTimer(STAGES[cur].min);
  render(); closeSide();
  window.scrollTo({top:0, behavior: reduced() ? "auto" : "smooth"});
}

/* ===== interactions ===== */
function tickEv(id, i, side){
  var k = id + i + side;
  S.ev[k] = !S.ev[k]; save();
  var st = STAGES[cur];
  if(st.id !== id){ renderMain(); return; }
  var btn = document.querySelector('.ev .evi:nth-child(' + (i+1) + ') .ab[data-c="' + side + '"]');
  if(!btn){ renderMain(); return; }
  btn.classList.toggle("on", !!S.ev[k]);
  var r = document.querySelector(".foot .flab .r");
  if(r) r.innerHTML = evLabel(st);
}
function setNote(id, v){ S.notes[id] = v; save(); }
function setOverall(side, v){ S.overall[side] = v; save(); }
function setBand(side, k, i){
  if(S.bands[side][k] === i) delete S.bands[side][k]; else S.bands[side][k] = i;
  save(); renderMain();
}
function pickQ(id, q){ S.pick[id] = q; save(); renderMain(); }
function wordDone(id, side, i){
  var k = id + side + i;
  S.words[k] = !S.words[k]; save();
  renderMain();
}
function loadNames(){
  SIDES.forEach(function(sd){ document.getElementById("name" + sd).value = S.names[sd] || ""; });
}
function setName(side, v){
  S.names[side] = v; save();
  renderMain();
}

/* ===== present ===== */
function present(){
  var st = STAGES[cur];
  var x = '<button type="button" class="x" onclick="closeLayer()">Close</button>';
  if(st.type === "qs"){
    layer('<div class="pres">' + x + '<div class="plabel">' + esc(st.title) + '</div>' +
      '<ul class="pbul">' + st.qs.map(function(q){ return "<li>" + esc(q.q) + "</li>"; }).join("") + '</ul></div>');
  } else if(st.type === "one"){
    layer('<div class="pres">' + x + '<div class="plabel">' + esc(st.title) + '</div>' +
      '<p class="pq">' + esc(S.pick[st.id] || st.q) + '</p></div>');
  } else if(st.type === "pair"){
    layer('<div class="pop">' + x + '<div class="pimgs">' +
      st.photos.map(function(k){ return '<img src="' + esc(PHOTOS[k].src) + '" alt="">'; }).join("") + '</div>' +
      '<div class="ptx">' + st.tasks.map(function(t){ return "<div>" + esc(t) + "</div>"; }).join("") + '</div></div>');
  } else if(st.type === "roles"){
    layer('<div class="pres">' + x + '<div class="plabel">' + esc(st.title) + '</div>' +
      '<p class="pq">' + esc(st.sit) + '</p>' +
      '<ul class="pbul">' + st.roles.map(function(r){
        return "<li>" + esc(r.lab) + ": " + esc(r.h) + "</li>"; }).join("") + '</ul></div>');
  } else if(st.type === "circles"){
    layer('<div class="pres">' + x + '<p class="pq">' + esc(st.deb.q) + '</p><div class="bubbles">' +
      st.deb.items.map(function(it,i){
        var s = S.bub[i], cls = "bub" + (s===1?" lit":"") + (s===2?" out":"");
        return '<div class="' + cls + '" data-bub="' + i + '" onclick="bubClick(' + i + ')"' +
               ' ondblclick="bubOut(' + i + ')">' + esc(it) + '</div>';
      }).join("") + '</div></div>');
  }
}
function presentEach(id, side){
  var st = null;
  STAGES.forEach(function(s){ if(s.id === id) st = s; });
  if(!st) return;
  var c = st.each[side];
  layer('<div class="pres"><button type="button" class="x" onclick="closeLayer()">Close</button>' +
    '<div class="plabel">' + esc(nm(side)) + '</div>' +
    '<p class="pq">' + esc(c.q) + '</p></div>');
}
function presentWords(id, side){
  var st = null;
  STAGES.forEach(function(s){ if(s.id === id) st = s; });
  if(!st) return;
  layer('<div class="pres"><button type="button" class="x" onclick="closeLayer()">Close</button>' +
    '<div class="plabel">' + esc(st.sets[side].lead) + '</div>' +
    '<div class="pwords">' + st.sets[side].words.map(function(w){
      return "<div>" + esc(w) + "</div>"; }).join("") + '</div></div>');
}
function interrupt(){
  var r = REPAIRS[Math.floor(Math.random() * REPAIRS.length)];
  layer('<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="modal">' +
    '<header><b>Interrupt</b><span class="mono">say it, then wait</span></header>' +
    '<div class="mbody"><p class="repair">“' + esc(r) + '”</p>' +
    '<ul class="repairs">' + REPAIRS.filter(function(x){ return x !== r; }).map(function(x){
      return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></div>' +
    '<footer><button type="button" class="btn" onclick="interrupt()">Another</button>' +
    '<button type="button" class="btn alt" onclick="closeLayer()">Close</button></footer></div></div>');
}

/* ===== layer ===== */
var closeT = null;
function layer(html){
  var l = document.getElementById("layer");
  clearTimeout(closeT); l.classList.remove("closing");
  l.innerHTML = html;
  markImgs();
}
function closeLayer(){
  var l = document.getElementById("layer");
  if(!l.firstChild || l.classList.contains("closing")) return;
  if(reduced()){ l.innerHTML = ""; return; }
  l.classList.add("closing");
  closeT = setTimeout(function(){ l.classList.remove("closing"); l.innerHTML = ""; }, 150);
}

/* ===== circles ===== */
function bubClick(i){ S.bub[i] = S.bub[i] === 0 ? 1 : 0; afterBub(i); }
function bubOut(i){ S.bub[i] = 2; afterBub(i); }
function afterBub(i){ save(); paintBub(i); }
function paintBub(i){
  var s = S.bub[i], els = document.querySelectorAll('[data-bub="' + i + '"]');
  if(!els.length){ renderMain(); return; }
  Array.prototype.forEach.call(els, function(el){
    var was = el.classList.contains("lit");
    el.classList.toggle("lit", s === 1);
    el.classList.toggle("out", s === 2);
    el.classList.remove("popin");
    if(s === 1 && !was && !reduced()){ void el.offsetWidth; el.classList.add("popin"); }
  });
}
function crossPhrase(i){
  S.bank[i].crossed = !S.bank[i].crossed; save();
  var li = document.querySelectorAll("#bank li")[i];
  if(li) li.classList.toggle("off", S.bank[i].crossed); else renderMain();
}
function toggleEdit(){ document.body.classList.toggle("bankedit"); renderMain(); }
function editPhrase(i, el){
  var v = el.textContent.trim();
  if(v){ S.bank[i].text = v; } else { S.bank.splice(i,1); }
  save(); renderMain();
}
function rmPhrase(i){ S.bank.splice(i,1); save(); renderMain(); }
function addPhrase(){
  S.bank.push({text:"New phrase", crossed:false}); save(); renderMain();
  var sp = document.querySelectorAll("#bank .tx");
  if(sp.length){ var last = sp[sp.length-1]; last.focus();
    var r = document.createRange(); r.selectNodeContents(last);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
}
function restoreBank(){
  S.bank = PHRASES.map(function(p){ return {text:p, crossed:false}; });
  save(); renderMain();
}

/* ===== the report ===== */
function reportText(){
  var out = ["SPEAKING ANALYSIS: TRIOS", ""];
  SIDES.forEach(function(sd){
    var ob = overallBand(sd), t = evTotals(sd);
    out.push(nm(sd).toUpperCase());
    out.push("  Working level: " + (ob === null ? "not set" : BANDS[ob]));
    CRITERIA.forEach(function(c){
      out.push("    " + c.n + ": " + (S.bands[sd][c.k] === undefined ? "-" : BANDS[S.bands[sd][c.k]]));
    });
    out.push("  Evidence heard: " + t.got + " of " + t.all);
    if((S.overall[sd] || "").trim()){ out.push("  Overall: " + S.overall[sd].trim()); }
    out.push("");
  });
  out.push("STAGE BY STAGE", "");
  STAGES.forEach(function(st){
    if(!(st.ev || []).length) return;
    out.push(st.title.toUpperCase());
    st.ev.forEach(function(e,i){
      var marks = SIDES.map(function(sd){ return S.ev[st.id + i + sd] ? nmShort(sd) : "-"; });
      out.push("  [" + marks.join("|") + "]  " + e);
    });
    var note = (S.notes[st.id] || "").trim();
    if(note) out.push("  note:  " + note);
    out.push("");
  });
  return out.join("\n");
}
function copyReport(b){
  var txt = reportText();
  navigator.clipboard.writeText(txt).then(function(){
    b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy all three profiles"; }, 1500);
  }, function(){
    layer('<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="modal">' +
      '<header><b>The profiles</b><span class="mono">select and copy</span></header>' +
      '<pre id="rtext">' + esc(txt) + '</pre>' +
      '<footer><button type="button" class="btn alt" onclick="closeLayer()">Close</button></footer></div></div>');
  });
}
function copyText(id, b){
  var t = document.getElementById(id).textContent;
  navigator.clipboard.writeText(t).then(function(){
    b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1400);
  }, function(){ b.textContent = "Select and copy"; });
}

/* ===== timer ===== */
var total = 120, left = 120, running = false, ticker = null;
function fmt(s){
  var neg = s < 0; s = Math.abs(s);
  var m = Math.floor(s/60), r = s%60;
  return (neg?"-":"") + (m<10?"0":"") + m + ":" + (r<10?"0":"") + r;
}
function paint(){
  var el = document.getElementById("clock");
  el.textContent = fmt(left);
  el.className = "t" + (left < 0 ? " up" : (running ? " run" : ""));
  document.getElementById("startb").textContent = running ? "Pause" : "Start";
  var bar = document.getElementById("cbar");
  if(bar){
    var f = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0;
    bar.firstChild.style.transform = "scaleX(" + f.toFixed(4) + ")";
    bar.className = "cbar" + (left < 0 ? " up" : "");
  }
  var ck = document.querySelector(".clock");
  if(ck) ck.classList.toggle("done", total > 0 && left <= 0);
}
function setTimer(min){ total = min*60; left = total; running = false; clearInterval(ticker); paint(); }
function toggleTimer(){
  running = !running; clearInterval(ticker);
  if(running){ ticker = setInterval(function(){ left--; paint(); }, 1000); }
  paint();
}

/* ===== shell ===== */
function openSide(){ document.getElementById("side").classList.toggle("open"); }
function closeSide(){ document.getElementById("side").classList.remove("open"); }
function setCollapsed(on){
  document.body.classList.toggle("collapsed", !!on);
  try{ localStorage.setItem(CKEY, on ? "1" : "0"); }catch(e){}
}
document.getElementById("collb").onclick = function(){ setCollapsed(true); };
document.getElementById("reopenb").onclick = function(){ setCollapsed(false); };
try{ if(localStorage.getItem(CKEY) === "1") document.body.classList.add("collapsed"); }catch(e){}
document.getElementById("interb").onclick = function(){ interrupt(); closeSide(); };
document.getElementById("menub").onclick = openSide;
document.getElementById("startb").onclick = toggleTimer;
document.getElementById("resetb").onclick = function(){ setTimer(total/60); };
document.getElementById("printb").onclick = function(){ window.print(); };
document.getElementById("prevb").onclick = prev;
document.getElementById("nextb2").onclick = next;
/* Clears the test on screen only. */
document.getElementById("clearb").onclick = function(){
  ALL.t[T] = blank();
  S = ALL.t[T]; save(); cur = 0;
  loadNames();
  setTimer(STAGES[0].min); render();
};
Array.prototype.forEach.call(document.querySelectorAll(".presets button"), function(b){
  b.onclick = function(){ setTimer(+b.dataset.min); };
});
document.getElementById("namea").oninput = function(){ setName("a", this.value); };
document.getElementById("nameb").oninput = function(){ setName("b", this.value); };
document.getElementById("namec").oninput = function(){ setName("c", this.value); };

document.addEventListener("keydown", function(e){
  var t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if(e.key === "Escape"){ closeLayer(); closeSide(); return; }
  if(e.key === " "){ e.preventDefault(); toggleTimer(); return; }
  if(e.key === "ArrowRight"){ e.preventDefault(); next(); return; }
  if(e.key === "ArrowLeft"){ e.preventDefault(); prev(); return; }
  if(e.key === "i" || e.key === "I"){ interrupt(); return; }
  if(e.key === "p" || e.key === "P"){ present(); return; }
});

var preReveal = null;
window.onbeforeprint = function(){
  preReveal = S.reveal; S.reveal = {};
  STAGES.forEach(function(st){ (st.photos || []).forEach(function(k){ S.reveal[st.id + k] = true; }); });
  renderMain();
};
window.onafterprint = function(){ S.reveal = preReveal || {}; renderMain(); };

ALL = loadAll();
useTest(0);
/* a link ending in #2 opens paper 2 directly */
(function(){ var h = parseInt((location.hash || "").slice(1), 10); if(h >= 1 && h <= TESTS.length) useTest(h - 1); })();
if(TESTS.length < 2){ document.getElementById("testlab").hidden = true; document.getElementById("testnav").hidden = true; }
cur = (typeof S.at === "number" && S.at >= 0 && S.at < STAGES.length) ? S.at : 0;
loadNames();
setTimer(STAGES[cur].min); render();
</script>
