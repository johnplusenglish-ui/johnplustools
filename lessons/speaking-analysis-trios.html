  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --col:880px; --sidew:272px;
  --t-micro:.12s; --t-base:.15s; --t-move:.2s; --t-enter:.3s;
  --ease:cubic-bezier(.22,1,.36,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --lift:0 1px 2px rgba(15,15,15,.045), 0 10px 28px rgba(15,15,15,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;letter-spacing:-.003em}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0;letter-spacing:-.025em}
h1{font-size:clamp(1.5rem,1.2rem + 1.3vw,1.95rem)}
h2{font-size:1.18rem}
h3{font-size:1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
html{scroll-behavior:smooth}

/* motion */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.snav button,.snav a{transition:background-color var(--t-micro) ease-out,color var(--t-micro) ease-out,
  border-color var(--t-micro) ease-out}
.cbtns button,.presets button,.sfoot button,.chip,.ghost,.phact button,.bank .bact button,.btn,.reopen,
.topbar button,.pop .x,.pres .x,.modal footer .btn,.ab,.band button,.nextb,.stepb{
  transition:background-color var(--t-micro) ease-out,border-color var(--t-micro) ease-out,
  color var(--t-micro) ease-out,transform var(--t-base) var(--ease)}
.chip:active,.ghost:active,.btn:active,.cbtns button:active,.presets button:active,.phact button:active,
.ab:active,.band button:active,.nextb:active,.stepb:active{transform:scale(.97)}
.pres,.pop,.pan{animation:fade var(--t-enter) ease-out both}
.pres>*,.pop>*{animation:fadeUp var(--t-enter) var(--ease) both}
.pres>*:nth-child(3){animation-delay:40ms}
.pres>*:nth-child(4){animation-delay:80ms}
.pres>*:nth-child(5){animation-delay:120ms}
.pres .x,.pop .x{animation:fade var(--t-enter) ease-out both}
.pan>header{animation:dropIn var(--t-enter) var(--ease) both}
.pan .pbody{animation:fadeUp var(--t-enter) var(--ease) 40ms both}
.scrim{animation:fade var(--t-base) ease-out both}
.modal{animation:modalIn var(--t-enter) var(--ease) both}
#layer.closing{animation:fadeOut var(--t-base) ease-out both;pointer-events:none}
.stage.just>*{animation:fadeUp var(--t-enter) var(--ease) both}
.stage.just>*:nth-child(2){animation-delay:30ms}
.stage.just>*:nth-child(3){animation-delay:60ms}
.stage.just>*:nth-child(4){animation-delay:90ms}
.stage.just>*:nth-child(5){animation-delay:120ms}

/* shell */
.wrap{display:grid;grid-template-columns:var(--sidew) 1fr;min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--side);
  border-right:1px solid var(--line);padding:16px 10px 24px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 9px;margin:0 0 6px}
.dot{width:22px;height:22px;border-radius:5px;background:var(--accent);flex:0 0 auto}
.brand b{font-weight:600;font-size:.95rem}
.brand span{display:block;font:500 .68rem/1.4 var(--mono);color:var(--faint);letter-spacing:.04em}
.glab{font:500 .67rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  padding:0 9px;margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
.glab .r{margin-left:auto;letter-spacing:.02em}
.snav{display:flex;flex-direction:column;gap:1px}
.snav button,.snav a{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
  border-radius:var(--r);padding:7px 9px;text-align:left;font-size:.9rem;color:var(--ink-2);text-decoration:none}
.snav button:hover,.snav a:hover{background:var(--hover);color:var(--ink)}
.snav button.on{background:var(--active);color:var(--ink);font-weight:500}
.snav .n{margin-left:auto;font:500 .72rem var(--mono);color:var(--faint)}
.snav button.on .n{color:var(--accent-ink)}
.snav .tk{flex:0 0 auto;width:14px;height:14px;line-height:0;color:#cfcfca;
  transition:color var(--t-micro) ease-out}
.snav button:hover .tk{color:var(--muted)}
.snav button.did .tk{color:var(--accent)}
.snav button.did{color:var(--muted)}
.snav button.on .tk{color:var(--accent-ink)}
.steps{display:flex;gap:5px;margin:8px 9px 0}
.stepb{flex:1;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-s);padding:5px 0;
  font:500 .74rem var(--mono);color:var(--ink-2)}
.stepb:hover{border-color:var(--ink);color:var(--ink)}
.stepb[disabled]{opacity:.4;cursor:default}

/* candidate names */
.whos{margin:4px 9px 0;display:grid;gap:6px}
.who1{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);
  border-radius:var(--r);padding:6px 9px}
.who1 .tag{flex:0 0 auto;width:20px;height:20px;border-radius:50%;font:600 .7rem/19px var(--mono);
  text-align:center;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink)}
.who1.b .tag{background:var(--warm-soft);border-color:var(--warm-line);color:var(--warm)}
.who1.c .tag{background:var(--leaf-soft);border-color:var(--leaf-line);color:var(--leaf)}
.who1 input{flex:1;min-width:0;border:0;background:transparent;font-size:.88rem;padding:0}
.who1 input:focus{outline:0}
.who1 input::placeholder{color:#b3b1ac}

/* timer */
.clock{margin:4px 9px 0;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:12px 12px 10px}
.clock .t{font:600 1.7rem/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  transition:color var(--t-micro) ease-out}
.clock .t.run{color:var(--accent-ink)}
.clock .t.up{color:var(--red)}
.clock.done .t{animation:pulse .45s var(--ease) 3}
.cbar{height:2px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(1);
  transition:transform 1s linear,background-color var(--t-micro) ease-out}
.cbar.up i{background:var(--red)}
.cbtns{display:flex;gap:5px;margin-top:10px}
.cbtns button{flex:1;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-s);padding:5px 0;
  font:500 .74rem var(--mono);color:var(--ink-2)}
.cbtns button:hover{border-color:var(--ink);color:var(--ink)}
.presets{display:flex;gap:5px;margin-top:6px}
.presets button{flex:1;border:1px solid transparent;background:var(--hover);border-radius:var(--r-s);
  padding:4px 0;font:500 .72rem var(--mono);color:var(--muted)}
.presets button:hover{background:var(--active);color:var(--ink)}
.prog{margin:20px 9px 0}
.prog .pl{display:flex;align-items:baseline;font:500 .67rem var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.prog .pl b{margin-left:auto;color:var(--ink-2);letter-spacing:.02em}
.prog .pb{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--accent);transform-origin:left center;
  transition:transform var(--t-move) var(--ease)}
.sfoot{margin:12px 9px 0;padding-top:12px;border-top:1px solid var(--line)}
.sfoot button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r);
  padding:6px 0;font-size:.82rem;color:var(--faint)}
.sfoot button:hover{color:var(--ink)}

/* main */
.main{padding:40px 34px 120px;max-width:calc(var(--col) + 68px);min-width:0}
.head{margin:0 0 20px}
.eyebrow{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow .sep{color:var(--line-2)}
.eyebrow .aim{color:var(--accent-ink)}
.hrow{display:flex;align-items:flex-start;gap:14px;margin-top:7px}
.hrow h1{flex:1;min-width:0}
.hact{display:flex;gap:6px;flex:0 0 auto;padding-top:5px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:3px 11px;
  font:500 .72rem var(--mono);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.key{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

.lead{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:var(--r);padding:11px 14px;margin:0 0 22px;font-size:.98rem;color:var(--ink-2);line-height:1.5}
.lead svg{flex:0 0 auto;margin-top:4px;color:var(--accent-ink)}

/* who chips inline */
.cA,.cB,.cC{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:999px;
  font:600 .67rem var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;white-space:nowrap}
.cA{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink)}
.cB{background:var(--warm-soft);border:1px solid var(--warm-line);color:var(--warm)}
.cC{background:var(--leaf-soft);border:1px solid var(--leaf-line);color:var(--leaf)}
.cBoth{background:var(--hover);border:1px solid var(--line-2);color:var(--muted);display:inline-flex;
  align-items:center;border-radius:999px;font:600 .67rem var(--mono);letter-spacing:.04em;
  text-transform:uppercase;padding:2px 9px;white-space:nowrap}

/* question lists */
.qs{list-style:none;padding:0;margin:0}
.qs li{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line)}
.qs li:first-child{border-top:0;padding-top:0}
.qs .q{flex:1;min-width:0}
.qs .push{display:block;margin-top:5px;font-size:.88rem;color:var(--muted);padding-left:13px;
  border-left:2px solid var(--accent-line)}
.qs .w{min-width:54px}

/* each-candidate blocks */
.twins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.twin{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface);
  transition:transform var(--t-base) var(--ease),border-color var(--t-micro) ease-out}
.twin::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--lift);opacity:0;
  pointer-events:none;transition:opacity var(--t-base) ease-out}
.twin:hover{transform:translateY(-1px);border-color:var(--line-2)}
.twin:hover::after{opacity:1}
.twin .th{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.twin .th .ghost{margin-left:auto}
.twin h3{font-size:1.02rem;line-height:1.35;margin-bottom:10px}
.twin ul{list-style:none;padding:0;margin:0}
.twin ul li{position:relative;padding:5px 0 5px 18px;color:var(--ink-2);font-size:.95rem}
.twin ul li::before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;
  background:var(--accent-line)}
.twin .follow{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:.91rem;color:var(--muted)}

/* big single question */
.big{font-size:clamp(1.2rem,1.05rem + .7vw,1.5rem);font-weight:600;line-height:1.35;letter-spacing:-.022em;
  max-width:30em;margin:0 0 18px}
.spares{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.spares li{padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem;color:var(--muted);
  display:flex;gap:11px;align-items:baseline}
.spares li button{background:transparent;border:0;padding:0;text-align:left;color:inherit;font:inherit;flex:1}
.spares li button:hover{color:var(--accent-ink)}
.spares .sw{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#b3b1ac}
.probes{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.probes .plab2{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin-bottom:8px}
.probes ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:7px}
.probes li{border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font-size:.87rem;color:var(--ink-2);
  background:#fff}

/* photographs */
.pairhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.cand{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  transition:transform var(--t-base) var(--ease),border-color var(--t-micro) ease-out}
.cand::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--lift);opacity:0;
  pointer-events:none;transition:opacity var(--t-base) ease-out}
.cand:hover{transform:translateY(-2px);border-color:var(--line-2)}
.cand:hover::after{opacity:1}
.ctop{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ctop b{font-size:.92rem;font-weight:600}
.ctop .who{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);
  color:var(--accent-ink);font:600 .72rem/20px var(--mono);text-align:center}
.ghost{background:transparent;border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:4px 10px;font-size:.78rem;color:var(--muted)}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
.ctop .ghost{margin-left:auto}
.cbody{position:relative;padding:0 14px 14px}
.ph{position:relative;aspect-ratio:3/2;background:#f3f3f1;border:1px solid var(--line);border-radius:var(--r-s);
  overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity var(--t-enter) ease-out,transform var(--t-move) var(--ease)}
.ph img.in{opacity:1}
.cand:hover .ph img.in,.slot:hover .ph img.in{transform:scale(1.025)}
.ph .empty{text-align:center;color:#a8a6a1;font:500 .74rem var(--mono);line-height:1.8}
.phact{display:flex;gap:6px;margin-top:8px}
.phact button{background:transparent;border:1px solid var(--line-2);border-radius:var(--r-s);padding:3px 9px;
  font:500 .72rem var(--mono);color:var(--muted)}
.phact button:hover{border-color:var(--ink);color:var(--ink)}
.phact button.warn{border-color:var(--red);color:var(--red)}
.phact .st{margin-left:auto;align-self:center;font:500 .7rem var(--mono);color:#b3b1ac}
.phact .st.ok{color:var(--accent-ink)}
.phact .st.err{color:var(--red)}
.tasks{list-style:none;padding:0;margin:14px 0 0}
.tasks li{padding:7px 0;border-top:1px solid var(--line);font-size:.94rem;color:var(--ink-2)}
.handover{display:flex;gap:10px;align-items:baseline;margin-top:14px;padding:11px 14px;background:var(--warm-soft);
  border:1px solid var(--warm-line);border-radius:var(--r);font-size:.93rem;color:var(--ink-2)}
.veil{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border-radius:0 0 var(--r) var(--r);
  background:rgba(247,247,245,.66);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  color:var(--faint);font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;
  transition:opacity var(--t-enter) ease-out,transform var(--t-enter) var(--ease)}
.cand.open .veil{opacity:0;transform:scale(1.02);pointer-events:none}
.cand.just2 .ph{animation:fadeUp var(--t-enter) var(--ease) both}
.cand.just2 .phact{animation:fadeUp var(--t-enter) var(--ease) 45ms both}

/* words */
.wsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.wset{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.wset .wh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.wset .wh .ghost{margin-left:auto}
.wset .wl{font-size:.9rem;color:var(--muted);margin-bottom:11px}
.words{display:grid;gap:8px}
.word{border:1px solid var(--line-2);border-radius:var(--r);background:#fff;padding:12px 10px;text-align:center;
  font-size:.98rem;font-weight:500;color:var(--ink-2);cursor:pointer;
  transition:background-color var(--t-base) var(--ease),color var(--t-base) var(--ease),
    border-color var(--t-micro) ease-out,transform var(--t-base) var(--ease)}
.word:hover{border-color:var(--accent);transform:translateY(-2px)}
.word.did{background:var(--side);border-style:dashed;color:#b3b1ac;text-decoration:line-through}

/* role play */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.role{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--surface);
  transition:border-color var(--t-micro) ease-out}
.role:hover{border-color:var(--line-2)}
.role .rl{font:600 .68rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);
  display:flex;align-items:center;gap:8px;margin-bottom:10px}
.role .rl .rn{width:19px;height:19px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);
  font:600 .68rem/17px var(--mono);text-align:center}
.role h3{font-size:1rem;line-height:1.4;margin-bottom:8px}
.role p{font-size:.92rem;color:var(--muted)}
.role .rw{display:grid;gap:7px;margin-top:12px}
.role .part{display:flex;align-items:center;gap:9px;font-size:.9rem;color:var(--ink-2)}
[hidden]{display:none !important}
.sit{border-left:2px solid var(--accent-line);padding:2px 0 2px 14px;margin:0 0 18px;font-size:.98rem;
  color:var(--ink-2);max-width:40em}
.swap{display:flex;gap:10px;align-items:baseline;margin-top:16px;padding:11px 14px;background:var(--warm-soft);
  border:1px solid var(--warm-line);border-radius:var(--r);font-size:.93rem;color:var(--ink-2)}

/* five circles */
.deb{display:grid;grid-template-columns:252px 1fr;gap:30px;align-items:start}
.bank{background:var(--side);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px}
.bank .bh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bank .bh span{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.bank .bh button{margin-left:auto;background:transparent;border:0;padding:2px;color:var(--faint);line-height:0}
.bank .bh button:hover{color:var(--accent-ink)}
.bank ul{list-style:none;padding:0;margin:0}
.bank li{display:flex;gap:7px;align-items:flex-start;padding:4px 0;font-size:.855rem;line-height:1.45;color:var(--ink-2)}
.bank li .tx{flex:1;border-radius:3px;padding:1px 3px;margin:-1px -3px;position:relative;
  transition:color var(--t-base) ease-out,background-color var(--t-micro) ease-out}
.bank li .tx::after{content:"";position:absolute;left:2px;right:2px;top:53%;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left center;transition:transform var(--t-move) var(--ease)}
.bank li.off .tx{color:#b3b1ac}
.bank li.off .tx::after{transform:scaleX(1)}
.bank.edit li .tx::after{display:none}
.bank li .tx:hover{background:var(--hover)}
.bank.edit li .tx{background:#fff;border:1px solid var(--line-2)}
.bank li .rm{border:0;background:transparent;color:#c3c1bc;padding:0 2px;line-height:1;font-size:.95rem}
.bank li .rm:hover{color:var(--red)}
.bank .bact{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.bank .bact button{flex:1;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:4px 0;
  font:500 .72rem var(--mono);color:var(--muted)}
.bank .bact button:hover{border-color:var(--ink);color:var(--ink)}
.debq{font-size:1.1rem;font-weight:600;line-height:1.35;letter-spacing:-.02em;margin:0 0 22px;max-width:36em}
.bubbles{display:flex;flex-wrap:wrap;gap:16px;max-width:600px;justify-content:center;margin:0 auto}
.bub{flex:0 0 auto;width:176px;height:176px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:1.1rem;border:1.5px solid var(--line-2);border-radius:50%;font-size:.9rem;font-weight:500;line-height:1.35;
  background:#fff;color:var(--ink-2);user-select:none;cursor:pointer;
  transition:background-color var(--t-base) var(--ease),color var(--t-base) var(--ease),
    border-color var(--t-micro) ease-out,transform var(--t-base) var(--ease),box-shadow var(--t-base) ease-out}
.bub:hover{border-color:var(--accent);transform:translateY(-2px)}
.bub:active{transform:scale(.98)}
.bub.popin{animation:pop var(--t-move) var(--ease-pop)}
.bub.lit{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 6px 22px rgba(35,131,226,.26)}
.bub.out{color:#b3b1ac;border-style:dashed;text-decoration:line-through;background:var(--side)}

/* listen for, three candidates */
.foot{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.flab{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.flab .r{margin-left:auto;letter-spacing:.02em;color:var(--ink-2)}
.ev{display:grid;gap:6px}
.evi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);
  padding:7px 8px 7px 13px;background:#fff;transition:border-color var(--t-micro) ease-out}
.evi:hover{border-color:var(--line-2)}
.evt{flex:1;min-width:0;font-size:.9rem;color:var(--ink-2)}
.abs{display:flex;gap:5px;flex:0 0 auto}
.ab{min-width:40px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:3px 9px;
  font:600 .7rem var(--mono);color:#b3b1ac;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:84px}
.ab:hover{border-color:var(--ink);color:var(--ink-2)}
.ab.on[data-c="a"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ab.on[data-c="b"]{background:var(--warm);border-color:var(--warm);color:#fff}
.ab.on[data-c="c"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.notes{margin-top:18px}
.notes textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 13px;font:400 .95rem/1.6 var(--sans);color:var(--ink);background:#fff;
  transition:border-color var(--t-micro) ease-out}
.notes textarea:focus{outline:0;border-color:var(--accent)}
.notes textarea::placeholder{color:#b3b1ac}

/* next */
.nextrow{display:flex;gap:10px;align-items:center;margin-top:30px}
.nextb{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);
  border:1px solid var(--ink);color:#fff;border-radius:var(--r);padding:13px 18px;font-size:.96rem;font-weight:500}
.nextb:hover{background:#000;border-color:#000}
.nextb .k{font:500 .7rem var(--mono);opacity:.6}
.nextb.alt{background:#fff;color:var(--ink-2);border-color:var(--line-2)}
.nextb.alt:hover{background:#fff;border-color:var(--ink);color:var(--ink)}

/* profile */
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:0 0 26px}
.verdict{display:flex;align-items:center;gap:16px;border:1px solid var(--accent-line);background:var(--accent-soft);
  border-radius:var(--r);padding:16px 18px}
.verdict.b{border-color:var(--warm-line);background:var(--warm-soft)}
.verdict.c{border-color:var(--leaf-line);background:var(--leaf-soft)}
.verdict .lv{font:600 2.1rem/1 var(--mono);letter-spacing:-.03em;color:var(--accent-ink);min-width:66px}
.verdict.b .lv{color:var(--warm)}
.verdict.c .lv{color:var(--leaf)}
.verdict .vt b{display:block;font-size:.95rem}
.verdict .vt span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:26px}
.tbox{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tbox b{display:block;font:600 1.4rem/1 var(--mono);letter-spacing:-.02em}
.tbox span{display:block;font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-top:6px}
.crits{display:grid;gap:2px}
.crit{padding:14px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit .cn b{display:block;font-size:.97rem;font-weight:600}
.crit .cn span{display:block;font-size:.85rem;color:var(--muted);margin-top:1px}
.bands2{display:grid;gap:6px;margin-top:11px}
.brow{display:flex;align-items:center;gap:9px}
.brow .bw{flex:0 0 auto;min-width:62px;font:600 .68rem var(--mono);letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.b .bw{color:var(--warm)}
.brow.c .bw{color:var(--leaf)}
.band{display:flex;gap:4px;flex:1}
.band button{flex:1;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-s);padding:6px 0;
  font:500 .74rem var(--mono);color:var(--muted)}
.band button:hover{border-color:var(--ink);color:var(--ink)}
.brow.a .band button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.brow.b .band button.on{background:var(--warm);border-color:var(--warm);color:#fff;font-weight:600}
.brow.c .band button.on{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
.heard{margin:0 0 20px}
.heard .hl{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin-bottom:7px}
.heard ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.heard li{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--ink-2);padding:3px 0}
.heard li .ht{flex:1;min-width:0}
.heard li .hm{flex:0 0 auto;display:flex;gap:4px}
.heard .pip{width:22px;border-radius:999px;font:600 .64rem/16px var(--mono);text-align:center;
  border:1px solid var(--line-2);color:#c9c7c2}
.heard .pip.on[data-c="a"]{background:var(--accent);border-color:var(--accent);color:#fff}
.heard .pip.on[data-c="b"]{background:var(--warm);border-color:var(--warm);color:#fff}
.heard .pip.on[data-c="c"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.jot{margin:0 0 18px}
.jot .jl{font:500 .67rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.jot .jb{border-left:2px solid var(--line-2);padding:2px 0 2px 14px;font-size:.93rem;color:var(--ink-2);
  white-space:pre-wrap}
.jot .jb.none{color:#b3b1ac}
.overs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* collapse */
.side .coll{margin-left:auto;background:transparent;border:0;padding:4px;color:#b3b1ac;line-height:0;border-radius:var(--r-s)}
.side .coll:hover{background:var(--hover);color:var(--ink-2)}
.wrap{transition:grid-template-columns var(--t-move) var(--ease)}
.side{min-width:0}
body.collapsed .wrap{grid-template-columns:0 1fr}
body.collapsed .side{overflow:hidden;border-right-color:transparent;pointer-events:none}
body.collapsed .side>*{opacity:0;transition:opacity var(--t-micro) ease-out}
.reopen{display:none;position:fixed;top:16px;left:16px;z-index:45;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--line-2);border-radius:var(--r);padding:6px 11px;font-size:.82rem;font-weight:500;color:var(--ink-2)}
.reopen:hover{border-color:var(--ink);color:var(--ink)}
body.collapsed .reopen{display:inline-flex;animation:dropIn var(--t-enter) var(--ease) both}
body.collapsed .main{margin:0 auto;max-width:calc(var(--col) + 68px);padding:40px 34px 120px}
@media (max-width:980px){ body.collapsed .wrap{grid-template-columns:1fr}
  body.collapsed .side{overflow:auto;border-right-color:var(--line);pointer-events:auto}
  body.collapsed .side>*{opacity:1}
  .reopen{display:none !important} body.collapsed .main{padding:26px 18px 90px} }

/* present */
.pres{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;padding:70px 48px 60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.pres .plabel{font:600 .74rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.pres .pq{max-width:24em;text-align:center;font-size:clamp(1.5rem,1.1rem + 1.6vw,2.3rem);font-weight:600;
  line-height:1.25;letter-spacing:-.025em;margin:0}
.pres .pbul{list-style:none;padding:0;margin:0;text-align:center}
.pres .pbul li{font-size:clamp(1.05rem,.9rem + .7vw,1.45rem);color:var(--ink-2);padding:8px 0}
.pres .pfoot{font-size:1.05rem;color:var(--muted);text-align:center;max-width:30em}
.pres .bub{width:220px;height:220px;font-size:1.06rem}
.pres .bubbles{max-width:800px;gap:20px}
.pres .pwords{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.pres .pwords div{border:1.5px solid var(--line-2);border-radius:var(--r-l);padding:16px 26px;font-size:1.5rem;
  font-weight:600;letter-spacing:-.02em}
@media (max-width:900px){ .pres{padding:64px 18px 40px;gap:24px} .pres .bub{width:148px;height:148px;font-size:.88rem} }
.pop{position:fixed;inset:0;background:#fff;z-index:60;padding:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;overflow:auto}
.pop .pimgs{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:min(1200px,94vw)}
.pop .pimgs img{flex:1 1 380px;max-width:560px;max-height:56vh;object-fit:contain;border-radius:var(--r);
  border:1px solid var(--line)}
.pop .ptx{max-width:900px;text-align:center;font-size:1.3rem;line-height:1.5;color:var(--ink-2)}
.pop .ptx div{padding:6px 0}
.pop .x,.pres .x{position:fixed;top:18px;right:20px;background:transparent;border:1px solid var(--line-2);
  border-radius:var(--r);padding:6px 12px;font:500 .78rem var(--mono);color:var(--muted);z-index:2}
.pop .x:hover,.pres .x:hover{border-color:var(--ink);color:var(--ink)}

/* photos panel */
.pan{position:fixed;inset:0;background:#fff;z-index:68;display:flex;flex-direction:column}
.pan>header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);flex:0 0 auto}
.pan>header b{font-size:.98rem}
.pan>header .mono{font:500 .72rem var(--mono);color:var(--faint)}
.pan .pbody{flex:1;overflow:auto;padding:22px 22px 70px;width:100%;max-width:1060px;margin:0 auto}
.pgrp{margin:0 0 26px}
.pglab{display:flex;align-items:baseline;gap:9px;font:500 .68rem var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.pglab b{color:var(--ink-2);font-weight:600;letter-spacing:0;text-transform:none;font-size:.86rem;font-family:var(--sans)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.slot .sh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.slot .sh b{font-size:.88rem;font-weight:600}
.slot .sh .st{margin-left:auto;font:500 .7rem var(--mono);color:#b3b1ac}
.slot .sh .st.ok{color:var(--accent-ink)}
.slot .sh .st.err{color:var(--red)}
.slot.over .ph{border-color:var(--accent);background:var(--accent-soft)}
.slot .ph .empty{font-size:.7rem}
@media (max-width:760px){ .pgrid{grid-template-columns:1fr} .pan .pbody{padding:16px 16px 60px} }

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,15,15,.28);z-index:70;display:grid;place-items:center;padding:26px}
.modal{background:#fff;border-radius:var(--r-l);box-shadow:var(--pop);width:min(780px,100%);max-height:84vh;
  display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header b{font-size:.95rem}
.modal header .mono{font:500 .72rem var(--mono);color:var(--faint)}
.modal pre{margin:0;padding:18px;overflow:auto;white-space:pre-wrap;font:400 .82rem/1.6 var(--mono);color:var(--ink-2)}
.modal .mbody{padding:18px;overflow:auto}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:7px 14px;border-radius:var(--r);font-size:.85rem;font-weight:500}
.btn.alt{background:#fff;color:var(--ink-2);border-color:var(--line-2)}
.btn.alt:hover{border-color:var(--ink);color:var(--ink)}
.repair{font-size:1.45rem;font-weight:600;line-height:1.35;letter-spacing:-.022em;text-align:center;padding:10px 0 4px}
.repairs{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.repairs li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--muted)}

/* mobile */
.topbar{display:none;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:9px 14px;align-items:center;gap:10px}
.topbar button{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line-2);
  border-radius:var(--r);padding:6px 11px;font-size:.85rem;font-weight:500}
.topbar b{font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
  .topbar{display:flex}
  .side{position:fixed;z-index:50;left:0;top:0;width:284px;transform:translateX(-102%);
    transition:transform var(--t-move) var(--ease);box-shadow:var(--pop)}
  .side.open{transform:none}
  .main{padding:26px 18px 90px}
  .deb{grid-template-columns:1fr;gap:22px}
  .cands,.twins,.roles,.wsets{grid-template-columns:1fr}
  .bub{width:144px;height:144px;font-size:.84rem;padding:.85rem}
  .bubbles{gap:12px}
  .hrow{flex-direction:column;gap:12px}
  .hact{padding-top:0}
  .evi{flex-wrap:wrap}
  .evt{flex:1 0 100%}
}
@media (max-width:480px){
  .bub{width:128px;height:128px;font-size:.8rem;padding:.65rem}
  .bubbles{gap:9px}
}
@media print{
  .side,.topbar,.chip,.ghost,.phact,.bank .bact,.bank .bh button,.nextrow,.lead svg,.reopen,
  .notes textarea,.steps{display:none !important}
  .wrap{grid-template-columns:1fr}
  .main{padding:0;max-width:none}
  .stage{page-break-inside:avoid}
  .veil{display:none !important}
  .ph img{opacity:1 !important}
  body{font-size:12pt}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  html{scroll-behavior:auto}
  .cand:hover,.twin:hover,.bub:hover,.bub:active,.word:hover,.cand:hover .ph img.in,
  .slot:hover .ph img.in{transform:none !important}
  .clock.done .t{animation:none !important}
}

/* ===== premium layer for the Speaking Analysis papers (solo, pairs, trios) =====
   Same layout, words and behaviour. A calm tinted page, solid white cards with soft
   shadows, Outfit for headings and Inter for text, larger radii, bigger tap targets.
   No gradients and no glass. Applied by apply.py between the premium markers. */
:root{
  --bg:#f4f5f8; --side:#ffffff; --surface:#ffffff;
  --ink:#171c2b; --ink-2:#333a4c; --muted:#5b6375; --faint:#737b8c;
  --line:rgba(30,40,80,.085); --line-2:rgba(30,40,80,.15); --hover:#f1f3f8; --active:#eaf0fe;
  --accent:#2f6feb; --accent-ink:#1d55c4; --accent-soft:#edf3ff; --accent-line:#cfdefc;
  --warm:#b85c12; --warm-soft:#fff3e6; --warm-line:#f6dcbf;
  --leaf:#1f8358; --leaf-soft:#e9f7f0; --leaf-line:#c5e8d6;
  --r:12px; --r-s:8px; --r-l:18px;
  --display:"Outfit","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --card:0 1px 2px rgba(30,40,80,.04),0 12px 32px -18px rgba(30,40,80,.22);
  --lift:0 2px 4px rgba(30,40,80,.05),0 18px 40px -18px rgba(30,40,80,.30);
  --pop:0 2px 6px rgba(30,40,80,.08),0 24px 60px -20px rgba(30,40,80,.35);
}
body{letter-spacing:-.006em}
h1,h2,h3,.big,.debq,.repair,.pres .pq,.pres .pwords div,.brand b{font-family:var(--display)}
h1{font-weight:700;font-size:clamp(1.85rem,1.4rem + 1.7vw,2.5rem);letter-spacing:-.022em;line-height:1.1}
h3{font-weight:600;letter-spacing:-.012em}
:focus-visible{border-radius:6px}

/* small labels: Inter capitals instead of a code font */
.glab,.eyebrow,.flab,.probes .plab2,.bank .bh span,.heard .hl,.jot .jl,.tbox span,.prog .pl,.spares .sw,
.role .rl,.pres .plabel,.pglab,.veil,.brand span{font-family:var(--sans);font-weight:600;letter-spacing:.075em}
.glab,.flab,.probes .plab2,.heard .hl,.jot .jl,.tbox span,.prog .pl{font-size:.69rem}
.eyebrow{font-size:.72rem;gap:9px}
.eyebrow .aim{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 10px;letter-spacing:.05em}

/* rail */
.side{background:#fff;padding:18px 12px 28px}
.brand{gap:11px;padding:4px 8px;margin-bottom:10px}
.brand b{font-size:1.06rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.64rem;color:var(--faint)}
.dot{width:30px;height:30px;border-radius:10px;box-shadow:0 8px 18px -8px var(--accent)}
.glab{margin:22px 0 8px;padding:0 10px}
.snav{gap:2px}
.snav button,.snav a{border-radius:10px;padding:9px 10px;font-size:.92rem}
.snav button.on{background:var(--active);color:var(--accent-ink);font-weight:600}
.snav .n{font-weight:600;font-size:.74rem;font-feature-settings:"tnum"}
.snav .tk{color:#c5cad6}
.steps{gap:6px;margin:10px 8px 0}
.stepb,.cbtns button{border-radius:9px;padding:8px 0;font-weight:600;font-size:.78rem;box-shadow:0 1px 2px rgba(30,40,80,.04)}
.stepb:hover,.cbtns button:hover{border-color:var(--accent);color:var(--accent-ink)}
.whos{margin:4px 8px 0;gap:7px}
.who1{border-radius:11px;padding:9px 11px;box-shadow:0 1px 2px rgba(30,40,80,.04);
  transition:border-color var(--t-micro) ease-out,box-shadow var(--t-micro) ease-out}
.who1:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.who1.b:focus-within{border-color:var(--warm);box-shadow:0 0 0 4px var(--warm-soft)}
.who1.c:focus-within{border-color:var(--leaf);box-shadow:0 0 0 4px var(--leaf-soft)}
.who1 .tag{width:24px;height:24px;font:700 .72rem/23px var(--sans)}
.who1 input{font-size:.93rem}
.who1 input::placeholder{color:#9aa1b0}
.clock{margin:4px 8px 0;border-radius:14px;padding:16px 14px 12px;border-color:var(--line);box-shadow:var(--card)}
.clock .t{font:700 2.15rem/1 var(--sans);letter-spacing:-.03em;font-feature-settings:"tnum"}
.cbar,.prog .pb{height:5px;border-radius:3px;background:rgba(30,40,80,.08)}
.cbar i,.prog .pb i{border-radius:3px}
.cbtns{gap:6px;margin-top:12px}
.presets{gap:6px;margin-top:7px}
.presets button{border-radius:8px;padding:6px 0;font-weight:600;font-size:.74rem;font-feature-settings:"tnum"}
.prog{margin:24px 10px 0}
.prog .pl b{font-size:.78rem;font-feature-settings:"tnum"}
.sfoot{margin:16px 10px 0;padding-top:14px}
.sfoot button{font-size:.86rem;padding:7px 0}
.sfoot button:hover{color:var(--accent-ink)}
.side .coll{color:#a3aab8;border-radius:8px}

/* stage head */
.main{padding-top:44px}
.head{margin-bottom:24px}
.hrow{margin-top:12px;align-items:center}
.hact{padding-top:0;gap:8px}
.chip{padding:7px 15px;font-weight:600;font-size:.8rem;font-feature-settings:"tnum";color:var(--ink-2);
  box-shadow:0 1px 2px rgba(30,40,80,.05)}
.chip.key{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
.chip.key:hover{color:#fff;filter:brightness(1.06)}
.lead{background:var(--accent-soft);border:0;border-radius:14px;padding:15px 18px;gap:12px;margin-bottom:24px;
  font-size:1.04rem;color:var(--ink)}
.lead svg{margin-top:5px}

/* who chips */
.cA,.cB,.cC,.cBoth{font-family:var(--sans);font-weight:700;font-size:.68rem;padding:4px 10px;letter-spacing:.05em}
.cBoth{background:#eef0f5;border-color:transparent;color:var(--muted)}

/* cards */
.qs,.twin,.wset,.role,.cand,.crits,.tbox,.verdict,.bank,.slot{background:#fff;border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--card)}
.qs{padding:6px 22px}
.qs li{padding:16px 0;gap:14px;font-size:1.03rem}
.qs li:first-child{padding-top:16px}
.qs .push{margin-top:7px;font-size:.92rem;border-left:0;padding-left:0;color:var(--muted)}
.qs .push::before{content:"then ";font-weight:600;color:var(--accent-ink)}
.qs .w{min-width:60px}
.twin{padding:22px 22px 20px}
.twin h3{font-size:1.16rem;line-height:1.32;margin-bottom:12px}
.twin .th{margin-bottom:14px}
.twin .follow{margin-top:16px;padding-top:14px;font-size:.94rem}
.twin:hover,.cand:hover{border-color:var(--line)}
.ghost{border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:600;background:#fff;color:var(--ink-2)}
.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.big{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--card);
  padding:30px 28px;max-width:none;font-size:clamp(1.4rem,1.1rem + 1.1vw,1.9rem);font-weight:600;line-height:1.25;
  letter-spacing:-.018em;margin-bottom:20px}
.spares{border-top:0}
.spares li{padding:12px 2px}
.spares .sw{color:var(--faint);font-size:.66rem}
.probes{margin-top:22px;padding-top:18px}
.probes ul{gap:8px}
.probes li{padding:7px 14px;font-size:.9rem;box-shadow:0 1px 2px rgba(30,40,80,.04)}
.ctop{padding:14px 16px}
.ctop b{font-family:var(--display);font-size:1.02rem}
.ctop .who{width:26px;height:26px;font:700 .76rem/24px var(--sans)}
.cbody{padding:0 16px 16px}
.ph{border-radius:12px;background:#eef0f5}
.veil{border-radius:0 0 var(--r-l) var(--r-l);font-size:.72rem}
.phact button{border-radius:8px;padding:5px 11px;font-weight:600;font-size:.76rem}
.tasks li{padding:11px 2px;font-size:1rem}
.handover,.swap{border:0;border-radius:14px;padding:14px 18px;font-size:.98rem;align-items:center}
.pairhead{margin-bottom:16px}

/* words */
.wset{padding:20px}
.wset .wl{font-size:.94rem;margin-bottom:14px}
.words{gap:10px}
.word{padding:16px 12px;font-family:var(--display);font-size:1.12rem;font-weight:600;color:var(--ink);
  box-shadow:0 1px 2px rgba(30,40,80,.05)}
.word:hover{box-shadow:0 0 0 4px var(--accent-soft)}
.word.did{box-shadow:none;background:#f4f5f8;color:#9aa1b0}

/* role play */
.role{padding:22px}
.role .rl{font-size:.7rem;gap:9px;margin-bottom:12px}
.role .rl .rn{width:24px;height:24px;border-radius:8px;border:0;font:700 .76rem/24px var(--sans)}
.role h3{font-size:1.12rem;line-height:1.35}
.role p{font-size:.96rem}
.role .rw{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);gap:9px}
.role .part{font-size:.95rem}
.sit{border-left:0;padding:0;font-size:1.04rem;color:var(--ink-2);margin-bottom:20px}

/* five circles */
.bank{padding:18px 16px 14px;box-shadow:var(--card)}
.bank li{font-size:.89rem;padding:5px 0}
.bank li .tx{border-radius:6px}
.debq{font-size:1.28rem;line-height:1.32;letter-spacing:-.015em;margin-bottom:26px}
.bub{border:1px solid var(--line-2);font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--ink);
  box-shadow:var(--card)}
.bub:hover{box-shadow:0 0 0 5px var(--accent-soft),var(--card)}
.bub.lit{box-shadow:0 14px 30px -12px var(--accent)}
.bub.out{box-shadow:none;background:#eef0f5;color:#9aa1b0}

/* listen for */
.foot{margin-top:40px;padding-top:26px}
.flab{margin-bottom:14px}
.flab .r{font-feature-settings:"tnum"}
.ev{gap:8px}
.evi{border-radius:12px;padding:9px 10px 9px 16px;min-height:50px;box-shadow:0 1px 2px rgba(30,40,80,.04)}
.evt{font-size:.96rem;color:var(--ink)}
.abs{gap:6px}
.ab{min-width:46px;min-height:32px;padding:5px 13px;font-weight:600;font-size:.76rem;color:var(--faint);max-width:96px}
.ab:hover{border-color:var(--accent);color:var(--accent-ink)}
.ab.on[data-c="a"]{box-shadow:0 6px 14px -8px var(--accent)}
.ab.on[data-c="b"]{box-shadow:0 6px 14px -8px var(--warm)}
.ab.on[data-c="c"]{box-shadow:0 6px 14px -8px var(--leaf)}
.ev>button{padding:9px 15px 9px 12px;font-size:.93rem;gap:9px;color:var(--ink);box-shadow:0 1px 2px rgba(30,40,80,.04)}
.ev>button .bx{width:16px;height:16px;border-radius:5px}
.ev>button:hover{border-color:var(--accent)}
.ev>button.on{font-weight:600;box-shadow:0 6px 14px -8px var(--accent)}
.notes textarea{border-radius:12px;padding:14px 16px;font-size:1rem;box-shadow:0 1px 2px rgba(30,40,80,.04);
  transition:border-color var(--t-micro) ease-out,box-shadow var(--t-micro) ease-out}
.notes textarea:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.notes textarea::placeholder{color:#9aa1b0}

/* next */
.nextrow{margin-top:34px;gap:12px}
.nextb{background:var(--accent);border-color:var(--accent);border-radius:14px;padding:17px 22px;
  font-family:var(--display);font-size:1.08rem;font-weight:600;letter-spacing:.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 26px -12px var(--accent),0 2px 4px rgba(30,40,80,.08)}
.nextb:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.06)}
.nextb .k{font-size:1rem;opacity:.85}
.nextb.alt{box-shadow:0 1px 2px rgba(30,40,80,.05);filter:none}
.nextb.alt:hover{border-color:var(--accent);color:var(--accent-ink);filter:none}
.btn{background:var(--accent);border-color:var(--accent);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.alt{background:#fff}

/* profile */
.verdicts{gap:16px;margin-bottom:18px}
.verdict{padding:18px;gap:16px}
.verdict.b,.verdict.c{background:#fff;border-color:var(--line)}
.verdict .lv{font:700 1.7rem/1 var(--display);letter-spacing:-.02em;min-width:78px;height:78px;border-radius:16px;
  display:grid;place-items:center;background:var(--accent-soft)}
.verdict.b .lv{background:var(--warm-soft)}
.verdict.c .lv{background:var(--leaf-soft)}
.verdict .vt b{font-family:var(--display);font-size:1.14rem;font-weight:600}
.verdict .vt span{font-size:.9rem}
.tally{gap:12px;margin-bottom:28px}
.tbox{padding:16px 18px;border-radius:14px}
.tbox b{font:700 1.5rem/1 var(--display);letter-spacing:-.02em}
.tbox span{margin-top:8px}
.meter{height:5px;border-radius:3px;background:rgba(30,40,80,.08);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent);transform-origin:left center}
.meter.mb i{background:var(--warm)}
.meter.mc i{background:var(--leaf)}
.crits{padding:4px 22px;gap:0}
.crit{padding:18px 0}
.crit .cn b{font-family:var(--display);font-size:1.08rem}
.crit .cn span{font-size:.9rem;margin-top:2px}
.bands2{gap:8px;margin-top:13px}
.brow .bw{font-family:var(--sans);font-weight:700;font-size:.7rem;min-width:66px}
.band{gap:6px}
.band button{border-radius:9px;padding:10px 0;font-weight:600;font-size:.8rem;color:var(--ink-2)}
.band button:hover{border-color:var(--accent);color:var(--accent-ink)}
.heard li{font-size:.93rem;padding:5px 0}
.heard .pip{width:26px;font:700 .66rem/19px var(--sans);color:#aab0be}
.jot .jb{border-left:0;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:.97rem}
.overs{gap:16px}

/* overlays */
.pres .plabel{font-size:.78rem}
.pres .pq{font-weight:700;letter-spacing:-.02em}
.pres .pwords div{border:1px solid var(--line-2);border-radius:18px;padding:20px 30px;box-shadow:var(--card)}
.pop .x,.pres .x{font-weight:600;border-radius:10px;padding:8px 15px;background:#fff}
.pop .pimgs img{border-radius:16px;box-shadow:var(--card)}
.scrim{background:rgba(20,26,45,.38)}
.modal header b{font-family:var(--display);font-size:1.08rem}
.modal header{padding:16px 20px}
.modal footer{padding:14px 20px}
.repair{font-size:1.7rem;line-height:1.28;padding:14px 0 8px}
.reopen{border-radius:10px;padding:8px 13px;font-weight:600;box-shadow:var(--card)}
.topbar{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 14px}
.topbar button{border-radius:10px;padding:8px 13px;font-weight:600}
.topbar b{font-family:var(--display);font-size:1rem;font-weight:600}
@media (max-width:980px){
  .hrow{align-items:flex-start}
  .tally{grid-template-columns:1fr 1fr}
  .qs{padding:4px 16px}
  .twin,.role,.wset{padding:18px}
  .big{padding:22px 18px}
  .crits{padding:2px 16px}
  .ab{min-height:36px}
  .band button{padding:12px 0}
}
@media print{
  body{background:#fff}
  .qs,.twin,.wset,.role,.cand,.crits,.tbox,.verdict,.bank,.big{box-shadow:none}
}
/* /premium */
</style>
</head>

<script>
/* ===== EDITABLE CONTENT ===================================================
   One speaking test for a TRIO of candidates, eleven stages, no photographs.
   Everything the examiner ticks is tracked per candidate, so the test ends in
   three profiles side by side. Any spoken line can use {A}, {B} and {C}, which
   become the typed names.
   ========================================================================= */

var PHRASES = [
  "Shall I go first?",
  "What do you think?",
  "What about you, …?",
  "I think the most important point is …",
  "Do you both agree?",
  "I completely agree with that.",
  "I'm not sure I agree.",
  "That's true, but on the other hand …",
  "For instance, …",
  "On top of that, …",
  "And don't forget that …",
  "Hmm, I'm not sure about that one.",
  "What's your take on …?",
  "Shall we move on?",
  "I think we can rule out …",
  "If I had to choose, I'd say …",
  "So, to sum up, …",
  "In the end, we all think …"
];

var REPAIRS = [
  "Sorry, you said Tuesday?",
  "Say that again, I missed the middle.",
  "Sorry, who is “they”?",
  "Do you mean the first one or the second one?",
  "I didn't catch that word. What does it mean?",
  "Can you say that another way?",
  "Hang on, so was that before or after?",
  "Ask one of the others what they meant by that."
];

/* ---- the tests. Each one is eleven stages, no photographs. ---- */

var TESTS = [
{
  n:1, title:"Shopping and consumerism",
  stages:[
{
  id:"warm", type:"qs", min:1, title:"Warm-up", aim:"Getting all three voices going",
  say:"Before we start properly, a few quick ones to each of you.",
  qs:[
    {to:"all", q:"How has your week been so far?"},
    {to:"a", q:"What was the last thing you bought?"},
    {to:"b", q:"And you? Was it something you needed?"},
    {to:"c", q:"Do you enjoy shopping, {C}, or is it a chore?"},
    {to:"ab", q:"Have either of you been in a shop today?"},
    {to:"all", q:"Who does the food shopping in your family?"}
  ],
  ev:["Answers in sentences, not single words","Present perfect","Listens while the others speak","Sounds comfortable"]
},
{
  id:"interview", type:"qs", min:4, title:"Interview", aim:"Finding each working level",
  say:"Now a bit about each of you. There are no right answers here.",
  qs:[
    {to:"a", q:"Tell me about the shops you use most often.", push:"Why those and not others?"},
    {to:"b", q:"Do you buy mostly online or in person?", push:"What would make you switch?"},
    {to:"c", q:"What's the best thing you've ever bought?", push:"What makes it the best?"},
    {to:"a", q:"Do you stick to a budget?", push:"What happens when you go over it?"},
    {to:"b", q:"How do you decide whether something is worth the money?", push:"Has that changed since you were a teenager?"},
    {to:"c", q:"What do you always buy the cheap version of, and what never?", push:"Why that line and not another?"},
    {to:"all", q:"Do people in your country buy too much?", push:"Who is to blame, the shops or the shoppers?"},
    {to:"all", q:"You each get a free hundred euros today, to spend on yourselves. What do you buy?", push:"And if you had to spend it on somebody else?"}
  ],
  ev:["Past, present and future all used","Used “would” naturally","Gave reasons unprompted","An opinion phrase","Self-corrected and carried on","Answers got longer under the push"]
},
{
  id:"story", type:"each", min:4, title:"Anecdote", aim:"Narrative tenses",
  say:"I'd like a story from each of you. Take fifteen seconds to think.",
  each:{
    a:{ q:"Tell me about something you bought and regretted.",
        follow:"Has anything like that happened to you, {B}?" },
    b:{ q:"Tell me about a bargain that turned out not to be one.",
        follow:"What would you have done, {C}?" },
    c:{ q:"Tell me about something you saved up for over a long time.",
        follow:"Have you ever done that, {A}?" }
  },
  probes:["How much did it cost?","What had you expected?","What happened in the end?","Would you do it again?"],
  ev:["Past simple and continuous together","Past perfect","Narrative linkers: just as, by the time, in the end","A story with a shape, not a list","Direct speech reported","Reacted to the others' stories"]
},
{
  id:"long", type:"each", min:4, title:"Long turn", aim:"Comparing and evaluating",
  say:"A minute each, with no notes. Take twenty seconds to think first, then the other two listen.",
  each:{
    a:{ q:"Compare buying things online with buying them in a shop. Which is better, and for whom?",
        follow:"{B}, which would you choose for a birthday present?" },
    b:{ q:"Compare buying something new with buying it second-hand.",
        follow:"{C}, would you wear a stranger's jacket?" },
    c:{ q:"Compare something you saved up for with something you bought on impulse.",
        follow:"{A}, which of those do you value more?" }
  },
  probes:["What does each one cost, besides money?","Who gains from each?","Is one of them changing fast?","Which would your parents choose?"],
  ev:["Comparatives and superlatives","whereas, while, unlike","Speculation: it might, it could, presumably","Moved from describing to evaluating","Held the full minute alone","The other two answered without rambling"]
},
{
  id:"sell", type:"each", min:3, title:"Sell it", aim:"Persuading",
  say:"Each of you has thirty seconds to sell something dull to the other two. They can ask one awkward question each.",
  each:{
    a:{ q:"Sell the others a reusable water bottle.",
        follow:"{B} and {C}: ask one awkward question each, then decide whether you'd buy it." },
    b:{ q:"Sell the others a second-hand phone.",
        follow:"{A} and {C}: ask one awkward question each, then decide whether you'd buy it." },
    c:{ q:"Sell the others a year's subscription to a streaming service.",
        follow:"{A} and {B}: ask one awkward question each, then decide whether you'd buy it." }
  },
  probes:["Why would I need that?","Isn't it cheaper somewhere else?","What if I change my mind?","What's the catch?"],
  ev:["Persuasive language: you'll love, imagine, it'll save you","Answered objections without panic","Second conditional: if you bought it …","A clear opening and a closing line","Asked a question to keep the buyers in","The buyers pushed back politely"]
},
{
  id:"explain", type:"words", min:3, title:"Say it another way", aim:"Paraphrase under pressure",
  say:"One of you explains, the other two guess. You can't use the word itself.",
  sets:{
    a:{ lead:"{A} explains, {B} and {C} guess.", words:["a bargain","a refund","to splash out"] },
    b:{ lead:"Now {B} explains, {A} and {C} guess.", words:["second-hand","a loyalty card","an impulse buy"] },
    c:{ lead:"Now {C} explains, {A} and {B} guess.", words:["a receipt","to haggle","a brand"] }
  },
  ev:["it's a kind of … / something you use to …","Relative clauses: the thing that …","Went round a gap instead of stopping","Asked a useful question while guessing","Stayed calm when stuck"]
},
{
  id:"role", type:"roles", min:4, title:"Role play", aim:"Register",
  say:"You three play this out together. We'll run it twice, in two different places.",
  sit:"The same three people, but not the same situation. Read your part before you start.",
  roles:[
    {n:"1", lab:"In the shop", h:"A customer bought a coat last week. The zip has already broken and there's no receipt.",
      p:"The assistant has to say no. The manager is the only one who can say yes.",
      parts:{a:"The customer", b:"The assistant", c:"The manager"}},
    {n:"2", lab:"At home", h:"Now you share a flat and have 400 euros left in the house money. The landlord arrives at six.",
      p:"You have to agree before he does. Nobody wants to fall out.",
      parts:{a:"Wants a new sofa", b:"Wants a coffee machine", c:"Wants to save it"}}
  ],
  swap:"If there's time, rotate the parts one place and run round 1 again.",
  ev:["Polite request forms: would you mind, I was wondering","Softening: a little, slightly, I'm afraid","The two rounds sounded different","Functional phrases, not just vocabulary","Handled being pushed back at","Stayed in role"]
},
{
  id:"spec", type:"qs", min:3, title:"Speculation", aim:"Conditionals",
  say:"None of these has happened. Say what you think anyway, and disagree with each other if you do.",
  qs:[
    {to:"a", q:"What would you do if every shop in your town closed tomorrow?"},
    {to:"b", q:"If you could only own fifty things, what would you keep?"},
    {to:"c", q:"If prices doubled overnight, what would you stop buying first?"},
    {to:"all", q:"What might make somebody spend more than they can afford?"},
    {to:"all", q:"Suppose everything you bought lasted thirty years. What would change?"},
    {to:"ab", q:"Looking back, what would you have spent less money on?"},
    {to:"c", q:"And you, {C}? Would you have done the same?"}
  ],
  ev:["Second conditional","Third conditional","would have, might have, must have","Unreal past: if I were, suppose","Took issue with the others","Did not retreat into the present"]
},
{
  id:"circles", type:"circles", min:5, title:"The five circles", aim:"Negotiating together",
  say:"This one is for the three of you. I'm not going to join in. You have to agree in the end.",
  deb:{
    q:"Your town has an empty high street and money for exactly one idea. Decide together which one goes ahead, and which you'd drop first.",
    items:["A huge shopping centre","A weekly street market","Small independent shops","A repair café","Free parking for everybody"]
  },
  ev:["Suggested rather than announced","Disagreed politely","Conceded a point, then came back","I'd rather, I'd sooner","Invited the quietest one in","Shared the floor fairly between all three","Reached a real decision"]
},
{
  id:"ceiling", type:"one", min:3, title:"The ceiling question", aim:"Finding the top",
  say:"One last one, and it's a hard one on purpose. Each of you answers, then argue it out.",
  q:"Do we buy too much?",
  spares:[
    "Is it ever right to buy something you don't need?",
    "Should advertising be more strictly controlled?",
    "Is cheap clothing a problem or a lifeline?",
    "Does owning things make us happier?",
    "Who is responsible for waste, the shops or the shoppers?"
  ],
  probes:["What would the others say?","Where do you draw the line?","Do you three actually disagree, or not?","What would change your mind?"],
  ev:["Abstract nouns handled","Long sentences that still hold together","it depends what you mean by …","Argued against their own point","Engaged with what the others actually said"]
},
{
  id:"profile", type:"profile", min:3, title:"The profiles", aim:"What you heard",
  say:"", ev:[]
}
  ]
}
];

/* ---- paper 2: Black Friday, twenty minutes, with a pair of photographs for each candidate.
   The Listen-for lists are borrowed from paper 1 by stage id. ---- */
(function(){
var EV = {};
TESTS[0].stages.forEach(function(st){ EV[st.id] = st.ev; });
TESTS.push({
  n:2, title:"Black Friday", mins:20,
  photos:{
    a1:{label:"The sales in town", src:"trios2-photos/a1.jpg"},
    a2:{label:"The sales at home", src:"trios2-photos/a2.jpg"},
    b1:{label:"Queuing for the doors", src:"trios2-photos/b1.jpg"},
    b2:{label:"The little bookshop", src:"trios2-photos/b2.jpg"},
    c1:{label:"The charity shop", src:"trios2-photos/c1.jpg"},
    c2:{label:"The designer shop", src:"trios2-photos/c2.jpg"}
  },
  stages:[
{ id:"warm", type:"qs", min:1, title:"Warm-up", aim:"Getting all three voices going",
  say:"Before we start properly, a few quick ones to each of you.",
  qs:[
    {to:"all", q:"Have any of you bought anything this week?"},
    {to:"a", q:"Do you like shopping, or do you just get it over with?"},
    {to:"b", q:"And you? Online, or in the shops?"},
    {to:"c", q:"Is Black Friday a big thing where you live, {C}?"}
  ], ev:EV.warm },
{ id:"interview", type:"qs", min:3, title:"Interview", aim:"Finding each working level",
  say:"Now a bit about each of you. There are no right answers here.",
  qs:[
    {to:"a", q:"What's the best bargain you've ever found?", push:"Would you have paid full price for it?"},
    {to:"b", q:"Have you ever bought something just because it was reduced?", push:"Did you actually use it?"},
    {to:"c", q:"How do you decide if something's worth the money?", push:"Has that changed as you've got older?"},
    {to:"a", q:"What do you never mind spending money on?", push:"And what do you hate paying for?"},
    {to:"b", q:"What's one thing you wish you hadn't bought?", push:"What would you have done with the money instead?"},
    {to:"c", q:"Do you plan what you buy, or decide in the shop?", push:"Which works out cheaper?"},
    {to:"all", q:"Do sales help people save money, or make them spend more?", push:"Which is true of you?"}
  ], ev:EV.interview },

/* The current test. STAGES is rebound when the test changes, so every call
   site below carries on reading the same name. */
var T = 0;
var STAGES = TESTS[T].stages;
var PHOTOS = TESTS[T].photos || {};

var CRITERIA = [
  {k:"flu", n:"Fluency and coherence", d:"Pace, pausing, holding the floor, hanging ideas together"},
  {k:"voc", n:"Vocabulary", d:"Range, precision, collocation, getting round a gap"},
  {k:"gra", n:"Grammar", d:"Range of structures first, then accuracy"},
  {k:"pro", n:"Pronunciation", d:"Sounds, stress, intonation, how much work the listener does"},
  {k:"int", n:"Interaction", d:"Taking turns, responding, repairing, keeping it going"}
];
var BANDS = ["A2","B1","B1+","B2","C1","C2"];
var SIDES = ["a","b","c"];

/* ===== state ===== */
var KEY = "jpe_speaking_trios_v1";
var CKEY = "jpe_speaking_trios_collapsed";
var cur = 0, S = null, ALL = null;

function blank(){
  return {
    at:0, names:{a:"", b:"", c:""},
    ev:{}, notes:{}, done:{}, words:{},
    bub:[0,0,0,0,0],
    bank:PHRASES.map(function(p){ return {text:p, crossed:false}; }),
    pick:{}, reveal:{},
    overall:{a:"", b:"", c:""}, bands:{a:{}, b:{}, c:{}}
  };
}
function mend(raw){
  var b = blank();
  if(!raw || typeof raw !== "object") return b;
  for(var k in b){ if(raw[k] === undefined || raw[k] === null) raw[k] = b[k]; }
  if(!raw.bub || raw.bub.length !== 5) raw.bub = [0,0,0,0,0];
  if(!raw.bank || !raw.bank.length || typeof raw.bank[0] !== "object") raw.bank = b.bank;
  if(!raw.bands || !raw.bands.a || !raw.bands.b || !raw.bands.c) raw.bands = {a:{}, b:{}, c:{}};
  if(!raw.names || typeof raw.names !== "object") raw.names = {a:"", b:"", c:""};
  if(!raw.overall || typeof raw.overall !== "object") raw.overall = {a:"", b:"", c:""};
  return raw;
}
/* One slice of state per test, so the two papers never mix. */
function loadAll(){
  var raw = null;
  try{ raw = JSON.parse(localStorage.getItem(KEY)); }catch(e){ raw = null; }
  if(!raw || !raw.t || !raw.t.length) raw = { t: [] };
  while(raw.t.length < TESTS.length) raw.t.push(blank());
  raw.t.length = TESTS.length;
  raw.t = raw.t.map(mend);
  return raw;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ALL)); return true; }catch(e){ return false; } }
/* Point STAGES and S at another test. */
function useTest(i){
  T = i;
  STAGES = TESTS[T].stages;
  PHOTOS = TESTS[T].photos || {};
  S = ALL.t[T];
}
function reduced(){ return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
/* {A} and {B} in any content string become the typed names, or A and B */
function sub(s){
  s = String(s);
  if(!S || !S.names) return s;
  return s.replace(/\{A\}/g, nm("a")).replace(/\{B\}/g, nm("b")).replace(/\{C\}/g, nm("c"));
}
function esc(s){ return sub(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function markImgs(){
  Array.prototype.forEach.call(document.querySelectorAll(".ph img"), function(im){
    if(im.complete && im.naturalWidth) im.classList.add("in");
  });
}
/* the name if one was typed, otherwise the letter */
function nm(side){
  var v = (S.names[side] || "").trim();
  return v || side.toUpperCase();
}
function nmShort(side){
  var v = (S.names[side] || "").trim();
  if(!v) return side.toUpperCase();
  return v.length > 8 ? v.slice(0,8) : v;
}

/* ===== rail ===== */
function tick(done){
  return '<span class="tk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="' + (done ? "2.6" : "1.8") + '" stroke-linecap="round" stroke-linejoin="round">' +
    (done ? '<path d="M20 6L9 17l-5-5"/>' : '<circle cx="12" cy="12" r="7"/>') + '</svg></span>';
}
function renderSide(){
  document.getElementById("testnav").innerHTML = TESTS.map(function(t,i){
    var done = 0;
    t.stages.forEach(function(st){ if(ALL.t[i].done[st.id]) done++; });
    return '<button type="button" class="' + (i===T?"on":"") + '" onclick="goTest(' + i + ')">' +
      esc(t.title) + '<span class="n">' + (done ? done + "/" + t.stages.length : t.n) + '</span></button>';
  }).join("");
  document.getElementById("stagenav").innerHTML = STAGES.map(function(st,i){
    return '<button type="button" class="' + (i===cur?"on ":"") + (S.done[st.id]?"did":"") +
      '" onclick="go(' + i + ')">' + tick(S.done[st.id]) + esc(st.title) +
      '<span class="n">' + st.min + '</span></button>';
  }).join("");
  document.getElementById("tbtitle").textContent = STAGES[cur].title;
  document.getElementById("prevb").disabled = cur === 0;
  document.getElementById("nextb2").disabled = cur === STAGES.length - 1;
  var n = 0;
  STAGES.forEach(function(st){ if(S.done[st.id]) n++; });
  document.getElementById("progtx").textContent = n + "/" + STAGES.length;
  document.getElementById("progbar").firstChild.style.transform =
    "scaleX(" + (n / STAGES.length).toFixed(4) + ")";
  var tot = 0;
  STAGES.forEach(function(st){ tot += st.min; });
  document.getElementById("totmin").textContent = (TESTS[T].mins || tot) + " min";
}

function reveal(id, k){

  S.reveal[key] = !S.reveal[key]; save();

  var on = !!S.reveal[key];
  var btn = c.querySelector(".ghost[data-rv]");
  if(btn) btn.textContent = on ? "Hide" : "Reveal";
  if(on){
    c.classList.add("open");
    if(!reduced()){ c.classList.add("just2"); setTimeout(function(){ c.classList.remove("just2"); }, 420); }

/* ===== the profiles ===== */
function evTotals(side){
  var got = 0, all = 0;
  STAGES.forEach(function(st){
    (st.ev || []).forEach(function(e,i){ all++; if(S.ev[st.id + i + side]) got++; });
  });
  return {got:got, all:all};
}
function overallBand(side){
  var vals = [];
  CRITERIA.forEach(function(c){ if(S.bands[side][c.k] !== undefined) vals.push(S.bands[side][c.k]); });
  if(!vals.length) return null;
  var sum = 0;
  vals.forEach(function(v){ sum += v; });
  return Math.round(sum / vals.length);
}
function profileHtml(){

    '<button type="button" class="nextb alt" onclick="window.print()">Print</button></div>';

/* ===== render ===== */
