<style>
:root{--bg:#f4f3ec;--card:#fff;--ink:#0f1b2d;--muted:#6b7686;--line:#eceadf;--accent:#2563eb;--soft:#eceffc;--soft-line:#dde3f8;--jpt-bar:68px}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer}

.main-inner{padding:20px 24px 48px;max-width:640px;margin:0 auto}

/* ── Style picker ──────────────────────────────────────────────────── */
.tmr-styles{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tmr-style-btn{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-radius:14px;border:1.5px solid var(--soft-line);background:var(--card);cursor:pointer;
  transition:border-color .12s,background .12s;text-align:left}
.tmr-style-btn:hover{border-color:var(--accent)}
.tmr-style-btn.active{border-color:var(--accent);background:var(--soft)}
.tmr-style-ico{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  background:var(--soft);color:var(--accent)}
.tmr-style-btn.active .tmr-style-ico{background:var(--accent);color:#fff}
.tmr-style-ico svg{width:18px;height:18px}
.tmr-style-name{font-size:13.5px;font-weight:700;display:block}
.tmr-style-desc{font-size:11px;color:var(--muted);margin-top:1px;display:block}

/* ── Stage ─────────────────────────────────────────────────────────── */
.tmr-card{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:30px 24px 26px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 20px 44px -28px rgba(30,50,110,.35);
  text-align:center}
.tmr-stage{width:min(100%,300px);aspect-ratio:4/5;margin:0 auto}
.tmr-svg{width:100%;height:100%;display:block}
.tmr-clock{font-size:46px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  margin-top:10px;transition:color .2s}
.tmr-clock.warn{color:#c2740c}
.tmr-clock.over{color:#c14343}
.tmr-status{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-top:2px}

/* ── Controls ──────────────────────────────────────────────────────── */
.tmr-controls{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:22px;flex-wrap:wrap}
.tmr-len{display:inline-flex;align-items:center;border:1px solid var(--soft-line);border-radius:999px;
  padding:3px 3px 3px 16px}
.tmr-len input{width:60px;font-family:inherit;font-size:15px;font-weight:700;text-align:center;
  border:none;outline:none;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.tmr-len button{width:30px;height:30px;border-radius:999px;border:none;background:transparent;
  color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.tmr-len button svg{width:14px;height:14px}
.tmr-len button:hover{background:var(--soft);color:var(--accent)}
.tmr-presets{display:flex;gap:6px}
.tmr-preset{font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;
  border:1px solid var(--soft-line);background:transparent;color:var(--muted);transition:.12s}
.tmr-preset:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.tmr-btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13.5px;
  font-weight:700;padding:10px 20px;border-radius:999px;border:none;background:var(--accent);
  color:#fff;transition:background .12s}
.tmr-btn:hover{background:var(--accent-deep,#1d4ed8)}
.tmr-btn svg{width:14px;height:14px;flex-shrink:0}
.tmr-icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--soft-line);
  background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
  transition:.12s;flex-shrink:0}
.tmr-icon-btn svg{width:16px;height:16px}
.tmr-icon-btn:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.tmr-mute.off{color:#c14343;border-color:#e8b8b8}

/* ── Present mode: same convention as Spin the Wheel's full-screen wheel,
   .tmr-stack lifted out with position:fixed rather than duplicated markup. */
body.tmr-presenting{overflow:hidden}
.tmr-present-backdrop{position:fixed;inset:0;z-index:300;background:var(--bg);display:none}
body.tmr-presenting .tmr-present-backdrop{display:block}
.tmr-present-close{position:fixed;top:20px;right:20px;z-index:302;display:none;width:42px;height:42px;
  border-radius:999px;border:1px solid var(--soft-line);background:var(--card);color:var(--muted);
  align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1;transition:.12s}
.tmr-present-close:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
body.tmr-presenting .tmr-present-close{display:flex}
body.tmr-presenting .tmr-stack{position:fixed;inset:0;z-index:301;display:flex;align-items:center;
  justify-content:center;background:var(--bg)}
body.tmr-presenting .tmr-card{background:transparent;border:none;box-shadow:none;padding:0}
body.tmr-presenting .tmr-stage{width:min(70vw,60vh,520px)}
body.tmr-presenting .tmr-clock{font-size:min(9vw,7.5vh,84px)}
body.tmr-presenting .tmr-present-only-hide{display:none}

@media (max-width:560px){.tmr-styles{flex-direction:column}.tmr-style-btn{min-width:0}}
</style>
<style>
/* jpt:chrome */
/* Site furniture. Identical on every page, so nothing shifts between them. */
:root{
  --bg:#f4f3ec; --card:#ffffff; --ink:#0f1b2d; --muted:#6b7686;
  --line:#eceadf; --accent:#2563eb; --accent-deep:#1d4ed8;
  --soft:#eceffc; --soft-line:#dde3f8;
  --shadow-card:0 1px 2px rgba(20,30,60,.04),0 20px 44px -28px rgba(30,50,110,.35);
}
[data-theme="dark"]{
  --bg:#0f1728; --card:#16213a; --ink:#eef2fb; --muted:#93a0bb;
  --line:#26324c; --accent:#5b8def; --accent-deep:#93b4f6;
  --soft:#1d2b46; --soft-line:#2b3c5c;
  --shadow-card:0 1px 2px rgba(0,0,0,.2),0 20px 44px -28px rgba(0,0,0,.7);
}

/* The brand is the site's name; John wants it prominent, so the bar is sized
   around it rather than the other way about. --jpt-bar is the single source of
   truth: the tools pin their sidebars to it. */
:root{--jpt-bar:68px}
.stopbar{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);padding:0 24px;height:var(--jpt-bar);flex-shrink:0;
  display:flex;align-items:center;gap:14px}
.st-brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--ink);line-height:1}
.st-brand .brand-icon{color:var(--accent);width:29px;height:29px;display:inline-flex;flex-shrink:0}
.st-brand .brand-icon svg{width:29px;height:29px}
.st-brand .brand-title{display:inline-flex;flex-direction:column;justify-content:center;gap:2px;line-height:1}
.brand-title{gap:3px}
.brand-title .k{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand-title .b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.grow{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:999px;background:transparent;border:none;cursor:pointer;color:var(--muted);
  transition:background .12s,color .12s}
.icon-btn svg{width:18px;height:18px;display:block}
.icon-btn:hover{background:var(--soft);color:var(--accent)}

.brand-wrap{position:relative;display:inline-flex}
button.st-brand{background:none;border:none;cursor:pointer;font-family:inherit;
  padding:6px 8px;margin-left:-8px;border-radius:11px;transition:background .12s}
button.st-brand:hover{background:var(--soft)}
.brand-chev{color:var(--muted);display:inline-flex;margin-left:2px;transition:transform .18s ease}
.brand-chev svg{width:16px;height:16px}
button.st-brand[aria-expanded="true"] .brand-chev{transform:rotate(180deg)}
.popmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:246px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px;
  box-shadow:0 12px 40px -12px rgba(15,27,45,.28),0 2px 8px rgba(15,27,45,.06);
  animation:pmIn .14s ease}
[data-theme="dark"] .popmenu{box-shadow:0 12px 40px -12px rgba(0,0,0,.6)}
.popmenu[hidden]{display:none}
@keyframes pmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pm-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:6px 10px 7px}
.pm-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;transition:background .12s}
.pm-item:hover,.pm-item:focus-visible{background:var(--soft);color:var(--accent);outline:none}
.pm-item[aria-current="true"]{background:var(--soft);color:var(--accent)}
.pm-ico{width:18px;height:18px;flex-shrink:0;color:var(--accent);display:inline-flex}
.pm-ico svg{width:18px;height:18px}
.pm-ext{margin-left:auto;color:var(--muted);display:inline-flex}
.pm-ext svg{width:13px;height:13px}
.pm-sep{height:1px;background:var(--line);margin:6px 4px}

/* Content geometry. Identical on the home page and every tool page. */
.shell{min-height:calc(100vh - var(--jpt-bar))}
.main-inner{padding:20px 24px 40px;max-width:1180px;margin:0 auto}
.tool-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.th-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  background:var(--soft);border:1px solid var(--soft-line);color:var(--accent)}
.th-icon svg{width:20px;height:20px;display:block}
.th-text h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.th-text p{font-size:12.5px;color:var(--muted);margin:2px 0 0;line-height:1.4}

@media (max-width:900px){.th-text p{display:none}}
/* The brand is a button with padding and a chevron, wider than a plain mark.
   Left full width it pushes the topbar actions off a phone screen. */
@media (max-width:700px){
  .stopbar{padding:0 14px;gap:8px}
  button.st-brand{padding:6px;margin-left:-6px}
  .popmenu{min-width:210px}
  /* Collapse the topbar's labelled button to its icon rather than shrinking the
     brand. font-size:0 hides the text node, which no selector can reach. */
  .stopbar .btn{font-size:0;gap:0;padding:9px 11px}
  .stopbar .btn svg{width:17px;height:17px}
}
@media print{.tool-head,.popmenu,.stopbar{display:none!important}}
@media (prefers-reduced-motion:reduce){.popmenu{animation:none}}
/* Download-icon dropdown, shared by the tools. */
.icon-action{width:36px;height:36px;border-radius:999px;border:1px solid var(--soft-line);
  background:transparent;color:var(--muted);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.icon-action:hover,.icon-action[aria-expanded="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.icon-action svg{width:16px;height:16px;display:block}
.exp-wrap{position:relative;display:inline-flex}
.exp-menu{left:auto;right:0;min-width:190px}
/* Sidebar collapse handle, shared by every tool that has a sidebar, so the
   chevron on the divider looks and behaves the same everywhere. */
.app{--jpt-side-w:302px}
.app.side-collapsed{--jpt-side-w:0px}
.jpt-side-handle{position:fixed;top:152px;left:max(15px,var(--jpt-side-w));
  transform:translateX(-50%);z-index:39;margin:0;width:30px;height:30px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 1px 4px rgba(15,27,45,.10);
  color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:left .22s ease,background .12s,color .12s,border-color .12s}
[data-theme="dark"] .jpt-side-handle{box-shadow:0 1px 4px rgba(0,0,0,.35)}
.jpt-side-handle:hover{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.jpt-side-handle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jpt-side-handle svg{width:15px;height:15px;transition:transform .22s ease}
.app.side-collapsed .jpt-side-handle svg{transform:rotate(180deg)}
@media (max-width:900px){.jpt-side-handle{display:none}}
@media print{.jpt-side-handle{display:none!important}}

/* Floating timer: a small permanent hourglass, bottom-right, on every tool
   page. Independent of any tool's own inline timer: this one survives
   navigation between tools (it's driven off a stored end-timestamp, not a
   per-page countdown) so a teacher can start it on one tool and check it
   from another. z-index sits above every present-mode overlay on the site
   (the highest of those is 302) so it stays usable mid-presentation. */
.jft-wrap{position:fixed;right:20px;bottom:20px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.jft-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 0;
  border-radius:999px;border:1px solid var(--soft-line);background:var(--card);color:var(--ink);
  box-shadow:0 8px 24px -10px rgba(15,27,45,.35);cursor:pointer;transition:border-color .12s;font-family:inherit}
.jft-btn:hover{border-color:var(--accent)}
.jft-icon{width:44px;height:44px;border-radius:999px;background:var(--soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.jft-icon svg{width:20px;height:20px}
.jft-live{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;display:none;padding-right:2px}
.jft-wrap.running .jft-live{display:inline}
.jft-wrap.running .jft-icon{animation:jftPulse 1.6s ease-in-out infinite;color:var(--accent)}
.jft-wrap.warn .jft-live,.jft-wrap.warn .jft-icon{color:#c2740c}
.jft-wrap.over .jft-live,.jft-wrap.over .jft-icon{color:#c14343}
@keyframes jftPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.jft-panel{width:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:0 20px 44px -20px rgba(15,27,45,.4);display:none}
.jft-wrap.open .jft-panel{display:block}
.jft-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.jft-panel-title{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.jft-panel-close{width:22px;height:22px;border-radius:999px;border:none;background:transparent;
  color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1}
.jft-panel-close:hover{background:var(--soft);color:var(--accent)}
.jft-controls{display:flex;align-items:center;justify-content:center;gap:2px;border:1px solid var(--soft-line);
  border-radius:999px;padding:3px 4px 3px 14px}
.jft-in{font-family:inherit;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  width:64px;text-align:center;background:transparent;border:none;outline:none;color:var(--ink)}
.jft-controls button{width:30px;height:30px;border-radius:999px;border:none;background:transparent;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s}
.jft-controls button svg{width:15px;height:15px}
.jft-controls button:hover{background:var(--soft);color:var(--accent)}
.jft-bar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.jft-bar span{display:block;height:100%;width:100%;background:var(--accent);border-radius:999px;transition:width .95s linear,background .3s}
.jft-wrap.warn .jft-bar span{background:#c2740c}
.jft-wrap.over .jft-bar span{background:#c14343;animation:jftOverPulse 1.1s ease-in-out infinite}
@keyframes jftOverPulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (max-width:700px){.jft-wrap{right:14px;bottom:14px}.jft-panel{width:190px}}
@media print{.jft-wrap{display:none!important}}
/* /jpt:chrome */
</style>
</head>

  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  str = String(str).trim();
  if (!str) return null;

    t = m * 60 + sc;

    if (!isFinite(mn)) return null;

        '" transform="rotate(' + (a + t * 90).toFixed(0) + ' ' + xy[0] + ' ' + xy[1] + ')"/>';
    }).join('');
    return '' +
      '<svg viewBox="0 0 160 200" class="tmr-svg" xmlns="http://www.w3.org/2000/svg">' +
        '<ellipse cx="80" cy="' + (knotY + 4) + '" rx="26" ry="5" fill="var(--ink)" opacity="0.08"/>' +
        '<circle cx="' + cx + '" cy="' + cy.toFixed(1) + '" r="' + (32 * (1 - t * 0.7)).toFixed(1) + '" fill="#fff6d8" opacity="' + ((1 - t) * 0.7).toFixed(2) + '"/>' +
        shards +
        (t > 0.4 ? '<path d="M74 ' + (knotY - 6) + ' Q80 ' + (knotY + 4) + ' 88 ' + (knotY - 4) + ' Q82 ' + knotY + ' 74 ' + (knotY - 6) + ' Z" fill="#c22a44" opacity="0.85"/>' : '') +
        (t > 0.4 ? '<circle cx="80" cy="' + (knotY - 2) + '" r="3" fill="#8a1830"/>' : '') +
      '</svg>';
  }

  /* Stress lines near the surface, only in the last stretch before it
     bursts - a taut-rubber tension cue, not a wrinkle (the opposite of what
     a deflating balloon would show). */
  var tension = progress > 0.7 ? ((progress - 0.7) / 0.3 * 0.4).toFixed(2) : 0;
  var tensionLines = progress <= 0.7 ? '' :
    '<path d="M' + (cx - r * 0.5).toFixed(1) + ' ' + (cy - r * 0.6).toFixed(1) + ' Q' + cx + ' ' + (cy - r * 0.75).toFixed(1) +
      ' ' + (cx + r * 0.5).toFixed(1) + ' ' + (cy - r * 0.6).toFixed(1) + '" fill="none" stroke="#ffd7de" stroke-width="1" opacity="' + tension + '"/>' +
    '<path d="M' + (cx - r * 0.35).toFixed(1) + ' ' + (cy + r * 0.3).toFixed(1) + ' Q' + cx + ' ' + (cy + r * 0.42).toFixed(1) +
      ' ' + (cx + r * 0.35).toFixed(1) + ' ' + (cy + r * 0.3).toFixed(1) + '" fill="none" stroke="#ffd7de" stroke-width="0.8" opacity="' + (tension * 0.7).toFixed(2) + '"/>';

  return '' +
    '<svg viewBox="0 0 160 200" class="tmr-svg" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<radialGradient id="tmrBalloonGrad" cx="0.35" cy="0.3" r="0.75">' +
          '<stop offset="0" stop-color="#ff8fa3"/><stop offset="0.55" stop-color="#f0435f"/><stop offset="1" stop-color="#c21f3d"/>' +
        '</radialGradient>' +
      '</defs>' +
      '<ellipse cx="80" cy="190" rx="24" ry="5" fill="var(--ink)" opacity="0.08"/>' +
      '<path d="M80 ' + knotY + ' Q' + (80 + sway).toFixed(1) + ' ' + (knotY + 15) + ' ' + (80 - sway).toFixed(1) + ' ' + (knotY + 28) +
        ' Q' + (80 + sway).toFixed(1) + ' ' + (knotY + 38) + ' 80 ' + (knotY + 46) + '" fill="none" stroke="var(--muted)" stroke-width="1.4" opacity="0.6"/>' +
      '<ellipse cx="' + cx + '" cy="' + cy.toFixed(1) + '" rx="' + r.toFixed(1) + '" ry="' + (r * 1.14).toFixed(1) + '" fill="url(#tmrBalloonGrad)"/>' +
      '<path d="M' + (cx - 6) + ' ' + (cy + r * 1.1).toFixed(1) + ' Q80 ' + (cy + r * 1.3).toFixed(1) + ' ' + (cx + 6) + ' ' + (cy + r * 1.1).toFixed(1) + ' Z" fill="#c21f3d"/>' +
      '<ellipse cx="80" cy="' + knotY + '" rx="4" ry="3" fill="#8a1830"/>' +
      tensionLines +
      '<ellipse cx="' + (cx - r * 0.32).toFixed(1) + '" cy="' + (cy - r * 0.4).toFixed(1) + '" rx="' + (r * 0.24).toFixed(1) + '" ry="' + (r * 0.36).toFixed(1) +
        '" fill="#ffffff" opacity="' + (0.3 + progress * 0.35).toFixed(2) + '" transform="rotate(-25 ' + (cx - r * 0.32).toFixed(1) + ' ' + (cy - r * 0.4).toFixed(1) + ')"/>' +
    '</svg>';
}

var TMR_RENDER = {
  hourglass: tmrRenderHourglass, ice: tmrRenderIce, candle: tmrRenderCandle, bomb: tmrRenderBomb,
  pizza: tmrRenderPizza, balloon: tmrRenderBalloon
};

/* ── Ticking ───────────────────────────────────────────────────────── */
function tmrRenderStage(progress) {
  document.getElementById('tmrStage').innerHTML = TMR_RENDER[state.style](progress, state.running);
}

function tmrTick() {
  var r = tmrCurrentRemaining();
  var progress = state.total > 0 ? 1 - (r / state.total) : 1;
  if (progress < 0) progress = 0;
  if (progress > 1) progress = 1;
  if (state.style === 'hourglass') tmrUpdateSand(progress, state.running);
  tmrRenderStage(progress);

  var whole = Math.ceil(r);
  if (whole !== tmrLastShown) {
    tmrLastShown = whole;
    document.getElementById('tmrClock').textContent = tmrFmt(r);
  }
  var clock = document.getElementById('tmrClock');
  var warn = r <= 60 && r > 0.05, over = r <= 0.05;
  clock.classList.toggle('warn', warn);
  clock.classList.toggle('over', over);
  document.getElementById('tmrStatus').textContent =
    over ? "Time's up" : (state.running ? 'Running' : (progress > 0.001 ? 'Paused' : 'Ready'));

  if (state.running && r <= 0.05) { tmrFinish(); return; }
}

function tmrStartLoop() { clearInterval(tmrIv); tmrIv = setInterval(tmrTick, 120); }
function tmrStopLoop() { clearInterval(tmrIv); tmrIv = null; }

/* ── Controls ──────────────────────────────────────────────────────── */
function tmrToggle() {
  tmrEnsureAudio();
  if (state.running) {
    state.remaining = tmrCurrentRemaining();
    state.running = false; state.endAt = null;
    tmrStopLoop();
  } else {
    if (state.remaining <= 0.05) state.remaining = state.total;
    state.endAt = Date.now() + state.remaining * 1000;
    state.running = true;
    tmrStartLoop();
  }
  tmrSave();
  tmrLastShown = null;
  tmrTick();
  tmrPaintButtons();
}

function tmrReset() {
  state.running = false; state.endAt = null; state.remaining = state.total;
  tmrStopLoop();
  tmrResetSand();
  tmrResetExplosion();
  tmrLastShown = null;
  tmrSave();
  tmrTick();
  tmrPaintButtons();
}

function tmrFinish() {
  state.running = false; state.endAt = null; state.remaining = 0;
  tmrStopLoop();
  tmrResetSand();
  if (state.style === 'bomb') { tmrBoom(); tmrTriggerExplosion(); }
  else if (state.style === 'balloon') { tmrPop(); tmrTriggerExplosion(); }
  else { tmrDing(); }
  tmrSave();
  tmrTick();
  tmrPaintButtons();
}

function tmrApplyLength(secs) {
  state.total = secs; state.remaining = secs;
  state.running = false; state.endAt = null;
  tmrStopLoop();
  tmrResetSand();
  tmrResetExplosion();
  tmrLastShown = null;
  tmrSave();
  document.getElementById('tmrLenInput').value = tmrFmt(secs);
  tmrTick();
  tmrPaintButtons();
}

function tmrOnLenInput(el) {
  var secs = tmrParse(el.value);
  if (secs == null) { el.value = tmrFmt(state.total); return; }
  tmrApplyLength(secs);
}

function tmrNudge(deltaMin) {
  tmrApplyLength(Math.max(15, Math.min(99 * 60 + 59, state.total + deltaMin * 60)));
}

function tmrSetPreset(sec) { tmrApplyLength(sec); }

function tmrToggleSound() {
  soundOn = !soundOn;
  document.getElementById('tmrMuteBtn').classList.toggle('off', !soundOn);
  tmrSaveSound();
}

function tmrSetStyle(id) {
  state.style = id;
  tmrResetExplosion();
  tmrSave();
  tmrBuildStyles();
  tmrTick();
}

function tmrPaintButtons() {
  var btn = document.getElementById('tmrStartBtn');
  btn.innerHTML = (state.running ? TMR_ICON_PAUSE : TMR_ICON_PLAY) +
    (state.running ? ' Pause' : (state.remaining < state.total ? ' Resume' : ' Start'));
  document.getElementById('tmrMuteBtn').classList.toggle('off', !soundOn);
}

function tmrBuildStyles() {
  document.getElementById('tmrStyles').innerHTML = TMR_STYLES.map(function (s) {
    return '<button type="button" class="tmr-style-btn ' + (s.id === state.style ? 'active' : '') +
      '" onclick="tmrSetStyle(\'' + s.id + '\')">' +
      '<span class="tmr-style-ico">' + TMR_ICONS[s.id] + '</span>' +
      '<span><span class="tmr-style-name">' + s.name + '</span><span class="tmr-style-desc">' + s.desc + '</span></span>' +
      '</button>';
  }).join('');
}

function tmrBuildPresets() {
  document.getElementById('tmrPresets').innerHTML = TMR_PRESETS.map(function (sec) {
    var label = sec < 60 ? sec + 's' : (sec / 60) + ' min';
    return '<button type="button" class="tmr-preset" onclick="tmrSetPreset(' + sec + ')">' + label + '</button>';
  }).join('');
}

/* ── Present mode ──────────────────────────────────────────────────── */
function tmrEnterPresent() {
  document.body.classList.add('tmr-presenting');
  try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
}

function tmrExitPresent() {
  document.body.classList.remove('tmr-presenting');
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); } catch (e) {}
}

document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && document.body.classList.contains('tmr-presenting')) tmrExitPresent();
});

document.addEventListener('keydown', function (e) {
  if (!document.body.classList.contains('tmr-presenting')) return;
  if (e.key === 'Escape') { tmrExitPresent(); return; }
  if (e.key === ' ') { e.preventDefault(); tmrToggle(); }
}, true);

tmrLoad();
tmrBuildStyles();
tmrBuildPresets();
document.getElementById('tmrLenInput').value = tmrFmt(state.total);
tmrPaintButtons();
tmrTick();
if (state.running) tmrStartLoop();
</script>

<script>
/* Pop-out switcher. The only navigation on the site. */
(function () {
  var btn = document.getElementById('brandBtn');
  var menu = document.getElementById('toolsMenu');
  if (!btn || !menu) return;
  function close() { if (menu.hidden) return; menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
  function open()  { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
  btn.addEventListener('click', function (e) { e.stopPropagation(); menu.hidden ? open() : close(); });
  document.addEventListener('click', function (e) {
    if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) { close(); btn.focus(); }
  });
})();
</script>

<script>
/* Theme toggle for pages whose tool does not bring its own. Shares the Debate
   Builder's key so the preference carries across the whole site. */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('jptThemeBtn');
  var icon = document.getElementById('jptThemeIcon');
  if (!btn || !icon) return;
  var SUN = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>'
          + '<line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>'
          + '<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>'
          + '<line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>'
          + '<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  function now(){ return root.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function paint(){ icon.innerHTML = now() === 'dark' ? SUN : MOON; }
  paint();
  btn.addEventListener('click', function () {
    var next = now() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('jpe_debate_theme', next); } catch (e) {}
    paint();
  });
})();
</script>

<!-- jpt:floattimer -->
<script>
(function () {
  var KEY = 'jpt_ftimer';
  var st = {total: 300, remaining: 300, running: false, endAt: null, open: false};
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var s = JSON.parse(raw); if (s && typeof s.total === 'number') st = s; }
  } catch(e){}

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
  function fmt(s){ var n=s<0; s=Math.abs(s);
    return (n?'-':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }
  function parse(str){ str=String(str).trim().replace(/\s*min(ute)?s?$/i,''); if(!str) return null; var t;
    if(str.indexOf(':')>=0){ var pp=str.split(':'); var m=parseInt(pp[0],10)||0; var sc=parseInt(pp[1],10)||0;
      if(sc>59) return null; t=m*60+sc; }
    else { var mn=parseFloat(str); if(!isFinite(mn)) return null; t=Math.round(mn*60); }
    if(!isFinite(t)||t<=0) return null; return Math.min(t, 99*60+59); }
  function currentRemaining(){ return st.running ? Math.round((st.endAt - Date.now())/1000) : st.remaining; }

  var HOURGLASS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14L12 12 5 3M5 21h14L12 12 5 21"/></svg>';
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/>'
    + '<rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
  var RESET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" '
    + 'stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';

  var wrap = document.createElement('div');
  wrap.className = 'jft-wrap';
  wrap.innerHTML =
    '<div class="jft-panel">' +
      '<div class="jft-panel-head"><span class="jft-panel-title">Timer</span>' +
        '<button class="jft-panel-close" type="button" title="Hide" aria-label="Hide timer panel">&times;</button></div>' +
      '<div class="jft-controls">' +
        '<input class="jft-in" type="text" inputmode="numeric" aria-label="Timer length" ' +
          'title="Type a length (5, or 5:30) and press Enter to start">' +
        '<button class="jft-play" type="button" title="Start / pause" aria-label="Start or pause">' + PLAY + '</button>' +
        '<button class="jft-reset" type="button" title="Reset" aria-label="Reset timer">' + RESET + '</button>' +
      '</div>' +
      '<div class="jft-bar"><span></span></div>' +
    '</div>' +
    '<button class="jft-btn" type="button" title="Timer" aria-label="Timer">' +
      '<span class="jft-icon">' + HOURGLASS + '</span><span class="jft-live"></span>' +
    '</button>';
  document.body.appendChild(wrap);

  var input = wrap.querySelector('.jft-in'), live = wrap.querySelector('.jft-live');
  var barFill = wrap.querySelector('.jft-bar span'), playBtn = wrap.querySelector('.jft-play');
  var btn = wrap.querySelector('.jft-btn');
  var iv = null;

  function paint(){
    var r = currentRemaining(), txt = fmt(r);
    live.textContent = txt;
    if (document.activeElement !== input) input.value = txt;
    var warn = r <= 60 && r > 0, over = r <= 0;
    wrap.classList.toggle('running', st.running);
    wrap.classList.toggle('warn', warn);
    wrap.classList.toggle('over', over);
    barFill.style.width = (over ? 100 : Math.max(0, Math.min(1, r / st.total)) * 100) + '%';
    playBtn.innerHTML = st.running ? PAUSE : PLAY;
  }
  function startTicking(){ clearInterval(iv); iv = setInterval(paint, 1000); }
  function stopTicking(){ clearInterval(iv); iv = null; }
  function applyOpen(){ wrap.classList.toggle('open', st.open); }
  function toggle(){
    if (st.running) { st.remaining = currentRemaining(); st.running = false; st.endAt = null; stopTicking(); }
    else { st.endAt = Date.now() + currentRemaining() * 1000; st.running = true; startTicking(); }
    save(); paint();
  }

  btn.addEventListener('click', function(){ st.open = !st.open; save(); applyOpen(); });
  wrap.querySelector('.jft-panel-close').addEventListener('click', function(){ st.open = false; save(); applyOpen(); });
  input.addEventListener('focus', function(){ if (st.running) toggle(); requestAnimationFrame(function(){ input.select(); }); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      e.preventDefault();
      var v = parse(input.value);
      if (v !== null) { st.total = v; st.remaining = v; st.running = false; st.endAt = null; save(); toggle(); }
      input.blur();
    } else if (e.key === 'Escape') { e.preventDefault(); paint(); input.blur(); }
  });
  playBtn.addEventListener('click', toggle);
  wrap.querySelector('.jft-reset').addEventListener('click', function(){
    st.running = false; st.endAt = null; st.remaining = st.total; stopTicking(); save(); paint();
  });

  applyOpen();
  paint();
  if (st.running) startTicking();
})();
</script>
