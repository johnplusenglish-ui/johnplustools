# johnplustools.com. Static site, generated locally by build.py.
# index.html is the home page; each tool is its own page under tools/.

[build]
  publish = "."

# The Shanti and Songs research pages. These sit outside build.py and carry their
# own password gate, separate from the site-wide one. Both rules must stay ABOVE
# the /:tool catch-all, which would otherwise match /shanti first.
[[redirects]]
  from = "/shanti"
  to = "/shanti/index.html"
  status = 200

[[redirects]]
  from = "/shanti/agencies"
  to = "/shanti/agencies.html"
  status = 200

# Short URLs: /debate-builder serves /tools/debate-builder.html, and so on for
# every tool. force = false, so a real file at that path always wins.
[[redirects]]
  from = "/:tool"
  to = "/tools/:tool.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Sources and tests are not part of the site.
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tests/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Private research pages, kept out of search results entirely.
[[headers]]
  for = "/shanti/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
