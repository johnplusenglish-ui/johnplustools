<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connected speech</title>
<script>(function(){
  var ok=false;try{ok=localStorage.getItem('jpt_gate_ok')==='1'}catch(e){}
  if(ok)return;
  document.documentElement.style.visibility='hidden';
  var HASH='7c229dcbe1a9abfa9292b1fdd8910b1a16edfbdffcb59c19a218fdbde9c253c9';
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
  function check(pw){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw)).then(function(buf){return hex(buf)===HASH});
  }
  function ask(){
    var pw;try{pw=prompt('Password required')}catch(e){return}
    if(pw===null)return;
    check(pw).then(function(match){
      if(match){try{localStorage.setItem('jpt_gate_ok','1')}catch(e){}document.documentElement.style.visibility=''}
      else{alert('Incorrect password.');ask()}
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',ask)}else{ask()}
})();</script>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Connected speech, Studio look (John 2026-11-21: "I love the studio").
   One typeface, a soft grey ground, white panels, black square play buttons, the real sound wave under
   every sentence, and an arc that draws under each join as the speaker reaches it. Built by build-connected-speech.py. */
:root{--ground:#F2F3F1;--ink:#16161A;--text:#3A3E39;--muted:#5D615C;--faint:#8C918A;--line:#E3E5E1;--panel:#fff;
  --acc:#2176FF;--acc-soft:#E8EEFF;--wave:#C9CEC8;--gone:#B5B9B3;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem 3rem}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1rem;padding:1.4rem 0 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-size:.92rem;font-weight:600;color:var(--muted)}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.top-c{display:flex;gap:.5rem;align-items:center}
.seg{display:flex;padding:3px;gap:3px;background:var(--panel);border-radius:12px;box-shadow:0 1px 0 var(--line)}
.seg button{min-height:38px;padding:0 .9rem;border:none;border-radius:9px;background:none;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;transition:background-color .12s ease-out,color .12s ease-out}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:0 1rem;border:none;border-radius:12px;background:var(--panel);box-shadow:0 1px 0 var(--line);font-weight:600;font-size:.9rem;color:var(--ink);text-decoration:none;cursor:pointer;transition:background-color .12s ease-out}
.btn:hover{background:#FAFAF9}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* the eight features */
.feats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:3px;background:var(--panel);border-radius:14px;box-shadow:0 1px 0 var(--line);margin-bottom:2.2rem}
.feats button{display:flex;flex-direction:column;align-items:flex-start;gap:.05rem;min-height:54px;padding:.45rem .65rem;border:none;border-radius:11px;background:none;cursor:pointer;text-align:left;color:var(--muted);transition:background-color .12s ease-out,color .12s ease-out}
.feats button:hover{background:var(--ground);color:var(--ink)}
.feats .fn{font-size:.72rem;font-weight:600;opacity:.75}
.feats .fl{font-size:.84rem;font-weight:700;line-height:1.2}
.feats button[aria-current="true"]{background:var(--ink);color:#fff}
/* feature head */
.fh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,40ch);gap:1rem 2.5rem;align-items:end;margin-bottom:1.6rem}
.kick{display:flex;align-items:center;gap:.5rem;font-size:.9rem;font-weight:600;color:var(--muted)}
.kick i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.fh h1{margin:.35rem 0 0;font-size:3.2rem;font-weight:700;letter-spacing:-.035em;line-height:1}
.fh .plain{font-size:1.15rem;color:var(--muted);margin-top:.4rem}
.fh .rule{font-size:1.05rem;line-height:1.55;color:var(--text)}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1rem;padding:1.2rem 1.4rem;background:var(--panel);border-radius:16px;box-shadow:0 1px 0 var(--line)}
.hero .from{color:var(--muted);font-size:1.05rem}
.hero .arr{color:var(--faint);font-size:.88rem}
.hero .to{font-size:2.2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.how{font-size:.9rem;color:var(--muted);margin:.7rem .2rem 0}
.mv{color:var(--acc);font-weight:700}
.gone{color:var(--gone);text-decoration-thickness:2px;text-decoration-color:var(--acc)}
/* steps */
.step{margin-top:2.4rem}
.sh{display:flex;align-items:center;gap:.6rem;margin:0 0 .3rem;font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.sn{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex:none}
.sub{margin:0 0 .9rem 2.15rem;color:var(--muted);font-size:.92rem}
.sens{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.sen{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15rem 1.1rem;align-items:center;padding:1.15rem 1.3rem 1rem;background:var(--panel);border-radius:18px;box-shadow:0 1px 0 var(--line);cursor:pointer;transition:box-shadow .15s ease-out}
.sen:hover{box-shadow:0 1px 0 var(--line),0 0 0 1.5px #D5D8D3}
.sen.on{box-shadow:0 1px 0 var(--line),0 0 0 1.5px var(--acc)}
.pb{grid-row:span 2;width:52px;height:52px;border-radius:14px;border:none;background:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .12s ease-out}
.pb svg{width:15px;height:15px;fill:#fff;margin-left:2px}
.sen.on .pb{background:var(--acc)}
.sen-t{position:relative;font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.35;min-width:0}
.w{transition:color .1s linear}
.w.ph{color:var(--ink)}
.sen-t .w:not(.ph){color:#6E726C}
.sen-t .w.now{color:var(--acc)}
.arcs{position:absolute;inset:0;pointer-events:none;overflow:visible}
.arcs path{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .28s var(--ease)}
.arcs path.go{stroke-dashoffset:0}
.ul{text-decoration:underline;text-decoration-color:#BCD3FF;text-decoration-thickness:3px;text-underline-offset:6px}
.sen-s{margin-top:.5rem;font-size:.98rem;color:var(--muted)}
.sen-s .snd{font-weight:700;color:var(--ink);margin-left:.3rem}
.lv{display:inline-block;font-size:.72rem;font-weight:700;color:var(--muted);background:var(--ground);border-radius:6px;padding:.1rem .45rem;margin-right:.6rem;vertical-align:.3em;letter-spacing:0}
.wave{grid-column:1 / -1;display:block;width:100%;height:44px;margin-top:.75rem}
.say{background:var(--panel);border-radius:18px;box-shadow:0 1px 0 var(--line);padding:1.2rem 1.4rem}
.say ol{margin:0;padding-left:1.2rem;color:var(--text)}
.say li{margin:.2rem 0}
.say p{margin-top:.7rem;color:var(--muted)}
.say a{color:var(--acc);font-weight:600}
.next{display:flex;justify-content:flex-end;margin-top:2.2rem}
.next .btn{background:var(--ink);color:#fff;box-shadow:none;padding:0 1.2rem}
.next .btn:hover{background:#2A2A30}
.note{min-height:1.4em;margin-top:.6rem;font-size:.9rem;color:#C2410C}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
@media(max-width:860px){
  .feats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .fh{grid-template-columns:minmax(0,1fr);align-items:start}
}
@media(max-width:600px){
  .wrap{padding:0 .8rem 2.5rem}
  .top{padding:1rem 0 .8rem}
  .feats{margin-bottom:1.6rem}
  .feats button{padding:.4rem .45rem;min-height:50px}
  .feats .fl{font-size:.74rem}
  .fh h1{font-size:2.4rem}
  .hero .to{font-size:1.8rem}
  .sen{gap:.15rem .8rem;padding:.95rem .9rem .85rem}
  .pb{width:46px;height:46px;border-radius:12px}
  .sen-t{font-size:1.3rem}
  .say{padding:1rem 1.1rem}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>

  const lv = r.lv ? `<span class="lv">${r.lv}</span>` : '';
  const said = r.phrase ? esc(r.phrase) : r.w.slice(r.a, r.b + 1).map(esc).join(' ').replace(/[.,?!]+$/, '');
  return `<li class="sen" data-g="${g}" data-i="${i}">
    <button class="pb" aria-label="Play: ${esc(r.w.join(' '))}">${PLAY}</button>

    const q1 = W[k].getBoundingClientRect(), q2 = W[k + 1].getBoundingClientRect();
    if (Math.abs(q1.top - q2.top) > 4) continue;
    const em = q1.height * .72, x1 = q1.right - box.left - Math.min(q1.width * .45, em * .55), x2 = q2.left - box.left + Math.min(q2.width * .45, em * .55), y = q1.bottom - box.top - q1.height * .1;
    out += `<path data-k="${k}" d="M${x1.toFixed(1)} ${y.toFixed(1)} Q${((x1 + x2) / 2).toFixed(1)} ${(y + q1.height * .45).toFixed(1)} ${x2.toFixed(1)} ${y.toFixed(1)}"/>`;
  }
  svg.innerHTML = out;
  svg.querySelectorAll('path').forEach(pa => pa.style.setProperty('--len', pa.getTotalLength() + 1));
}
function layout(){ document.querySelectorAll('#feat .sen').forEach(li => { arcsFor(li); if (row(li)._buf) wave(li, row(li)._buf, -1); }); }
document.fonts && document.fonts.ready.then(layout);
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

/* the real sound wave, filling in blue as it plays */
function wave(li, b, t){
  const c = li.querySelector('.wave'); if (!c || !c.clientWidth) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const d = b.getChannelData(0), gap = 6, n = Math.floor(w / gap), step = Math.max(1, Math.floor(d.length / n));
  let peak = 0; for (let i = 0; i < d.length; i += 16) peak = Math.max(peak, Math.abs(d[i]));
  for (let i = 0; i < n; i++){
    let m = 0; for (let j = 0; j < step; j += 8) m = Math.max(m, Math.abs(d[i * step + j] || 0));
    const bh = Math.max(2, Math.min(h, (m / (peak || 1)) * h));
    g.fillStyle = t >= 0 && i / n <= t / b.duration ? getComputedStyle(document.documentElement).getPropertyValue('--acc') : '#C9CEC8';
    g.fillRect(i * gap, (h - bh) / 2, 3.5, bh);
  }
}

/* audio: decode each clip once and play it whole; never cut */
let ctx = null, node = null, on = null, timer = 0;
const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
const bufs = {};
function clip(url){
  if (!bufs[url]) bufs[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => ac().decodeAudioData(b, res, rej)))
    .catch(e => { delete bufs[url]; throw e; });
  return bufs[url];
}
function stop(){
  clearInterval(timer);
  if (node){ node.onended = null; try{ node.stop(); }catch(e){} node = null; }
  if (on){
    on.classList.remove('on'); on.querySelectorAll('.now').forEach(w => w.classList.remove('now'));
    const r = row(on); if (r && r._buf) wave(on, r._buf, -1);
    on = null;
  }
}
async function play(li){
  if (on === li){ stop(); return; }
  stop(); $('note').textContent = '';
  const r = row(li), c = ac(); c.resume();
  on = li; li.classList.add('on');
  let b;
  try{ b = await clip(src(r)); }
  catch(e){ stop(); $('note').textContent = "That clip couldn't load. Check your connection and try again."; return; }
  if (on !== li) return;
  r._buf = b;
  li.querySelectorAll('.arcs path').forEach(p => p.classList.remove('go'));
  const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination);
  s.onended = () => { if (node === s){ node = null; stop(); } };
  const t0 = c.currentTime + .03; s.start(t0); node = s;
  const T = r.t[S.voice], W = li.querySelectorAll('.w'), P = li.querySelectorAll('.arcs path');
  const tick = () => {
    const t = c.currentTime - t0;
    W.forEach((w, k) => w.classList.toggle('now', t >= T[k][0] && t < T[k][1]));
    P.forEach(p => { if (t >= T[+p.dataset.k][1] - .08) p.classList.add('go'); });
    wave(li, b, t);
  };
  tick(); timer = setInterval(tick, 30);   /* a timer, not animation frames: those pause in some embedded views */
}

function go(k, top){
  S.f = k; save(); history.replaceState(null, '', '#' + k); render();
  if (top){ const easy = matchMedia('(prefers-reduced-motion: reduce)').matches; $('feats').scrollIntoView({block: 'start', behavior: easy ? 'auto' : 'smooth'}); }
}
$('feats').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) go(b.dataset.k, false); });
$('voice').addEventListener('click', e => { const b = e.target.closest('[data-voice]'); if (!b) return; S.voice = b.dataset.voice; save(); render(); });
$('feat').addEventListener('click', e => {
  if (e.target.closest('#nextBtn')){ const i = DATA.indexOf(cur()); go(DATA[(i + 1) % DATA.length].key, true); return; }
  const li = e.target.closest('.sen'); if (li) play(li);
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (DATA.some(f => f.key === h) && h !== S.f) go(h, false); });
render();
</script>
