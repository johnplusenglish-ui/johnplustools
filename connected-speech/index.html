<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connected speech</title>
<script>(function(){
  var ok=false;try{ok=localStorage.getItem('jpt_gate_ok')==='1'}catch(e){}
  if(ok)return;
  document.documentElement.style.visibility='hidden';
  var HASH='7c229dcbe1a9abfa9292b1fdd8910b1a16edfbdffcb59c19a218fdbde9c253c9';
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
  function check(pw){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw)).then(function(buf){return hex(buf)===HASH});
  }
  function ask(){
    var pw;try{pw=prompt('Password required')}catch(e){return}
    if(pw===null)return;
    check(pw).then(function(match){
      if(match){try{localStorage.setItem('jpt_gate_ok','1')}catch(e){}document.documentElement.style.visibility=''}
      else{alert('Incorrect password.');ask()}
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',ask)}else{ask()}
})();</script>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Connected speech, built as a twin of the Shadowing page (John 2026-11-22: "so simple, easy on the eye, like the
   shadowing page"). One card: the features across the top, the rule in one quiet band, ONE sentence at a time in the
   middle, Listen and the sentence dots at the bottom. Built by build-connected-speech.py. */
:root{--ground:#F7F6F3;--ink:#2D3047;--weak:#8588A0;--muted:#7A7D8E;--line:#E8E5DF;--panel:#fff;
  --acc:#2176FF;--acc-soft:#E8EEFF;--gone:#B8BAC4;--head:'Outfit',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.6 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 2rem 3rem}
/* header, same as Shadowing */
.top{display:flex;align-items:center;gap:1.25rem;padding:2rem 0 1rem}
.top-icon{width:52px;height:52px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.top-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-t{min-width:0}
.top h1{margin:0;font-family:var(--head);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.01em;line-height:1.1}
.top-sub{color:var(--muted);font-weight:500;margin-top:.55rem}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:.45rem .95rem;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);font-family:var(--head);font-weight:700;font-size:.88rem;color:var(--ink);text-decoration:none;margin-left:auto;flex:none;transition:border-color .12s ease-out}
.btn:hover{border-color:var(--ink)}
/* the card */
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 2px 12px rgba(45,48,71,.04);overflow:clip}
.feats{display:flex;gap:.25rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.feats::-webkit-scrollbar{display:none}
.feats button{flex:none;min-height:40px;padding:0 .8rem;border:none;border-radius:10px;background:none;font-family:var(--head);font-size:.9rem;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer;transition:background-color .12s ease-out,color .12s ease-out}
.feats button:hover{color:var(--ink)}
.feats button[aria-current="true"]{background:var(--acc-soft);color:var(--acc)}
/* the rule: one quiet band */
.rule{padding:1.3rem 1.5rem 1.4rem;background:var(--ground);border-bottom:1px solid var(--line)}
.rule h2{margin:0;font-family:var(--head);font-size:1.25rem;font-weight:800;line-height:1.25}
.rule p{margin-top:.35rem;max-width:72ch;color:#5C5F74;font-size:.98rem}
/* the sentence */
.stage{padding:3.6rem 2.5rem 2.4rem;text-align:center}
.sen-t{position:relative;font-size:clamp(1.6rem,3.8vw,2.3rem);font-weight:500;letter-spacing:-.018em;line-height:1.5;color:var(--weak);text-wrap:balance}
.w{transition:color .1s linear}
.w.ph{color:var(--ink);font-weight:800}
.w.now{color:var(--acc)}
.w.ul{text-decoration:underline;text-decoration-color:#BCD3FF;text-decoration-thickness:3px;text-underline-offset:7px}
.arcs{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* the join arcs always show, pale; each one turns full blue as the speaker reaches it */
.arcs path{fill:none;stroke:#BCD3FF;stroke-width:3.5;stroke-linecap:round;transition:stroke .15s ease-out}
.arcs path.go{stroke:var(--acc)}
.lv{display:inline-block;font-family:var(--head);font-size:.72rem;font-weight:700;color:var(--muted);background:var(--ground);border-radius:6px;padding:.1rem .45rem;margin-right:.6rem;vertical-align:.5em;letter-spacing:0}
.like{margin-top:2rem;font-size:.84rem;font-weight:600;color:var(--muted)}
.snd{margin-top:.1rem;font-family:var(--head);font-size:1.7rem;font-weight:700;line-height:1.3;color:var(--ink)}
.mv{color:var(--acc)}
.gone{color:var(--gone);text-decoration-thickness:2px;text-decoration-color:var(--acc)}
.how{margin-top:.5rem;font-size:.86rem;color:var(--muted)}
.how .mv{font-weight:700}
.wave{display:block;width:min(100%,460px);height:36px;margin:1.9rem auto 0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:1.9rem}
.seg button{min-height:34px;min-width:44px;padding:0 .7rem;border:none;background:var(--panel);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color .12s ease-out,color .12s ease-out}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.seg svg{width:20px;height:20px;fill:currentColor}
/* the dock, same as Shadowing */
.dock{border-top:1px solid var(--line);padding:1.2rem 1.2rem .9rem}
.act{display:flex;flex-direction:column;align-items:center;gap:.35rem;margin:0 auto;background:none;border:none;padding:0;cursor:pointer;font-family:var(--head);font-size:.84rem;font-weight:700;color:var(--ink)}
.act-c{width:60px;height:60px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),background-color .12s ease-out}
.act:active .act-c{transform:scale(.94)}
.act svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.act.on .act-c{background:var(--acc)}
.act.on svg{margin-left:0}
.nav{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-top:.9rem}
.nav-b{width:44px;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .12s ease-out}
.nav-b:hover{border-color:var(--ink)}
.nav-b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:.35rem}
.dots button{width:32px;height:32px;border:none;border-radius:8px;background:var(--acc-soft);color:var(--acc);font-family:var(--head);font-size:.8rem;font-weight:700;cursor:pointer;transition:background-color .12s ease-out,color .12s ease-out}
.dots button[aria-current="true"]{background:var(--acc);color:#fff}
.note{min-height:1.4em;margin-top:.6rem;font-size:.9rem;color:#C2410C;text-align:center}
.foot{margin-top:.9rem;padding:0 .3rem;font-size:.82rem;color:var(--muted)}
.foot a{color:var(--acc);font-weight:600}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
@media(max-width:600px){
  .wrap{padding:0 1.1rem 2.5rem}
  .top{padding:1rem 0 .7rem;gap:.6rem}
  .top-icon,.top-sub{display:none}
  .top h1{font-size:1.65rem}
  .feats{padding:.55rem .6rem}
  .rule{padding:1rem 1.1rem 1.1rem}
  .rule h2{font-size:1.1rem}
  .rule p{font-size:.92rem}
  .stage{padding:2.4rem 1.2rem 1.6rem}
  .snd{font-size:1.45rem}
  .dock{padding:1rem 1rem .7rem}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M7 6v12M11 9v6"/><path d="M11 15c2 3 4 3 6 0"/><path d="M17 9v6M21 7v10"/></svg></div>
    <div class="top-t"><h1>Connected speech</h1><p class="top-sub">Hear how words join, change and drop sounds in real speech.</p></div>

  <main class="card">

      <button class="act" id="listenBtn"><span class="act-c"></span><span class="act-l">Listen</span></button>
      <div class="nav">
        <button class="nav-b" id="prevBtn" aria-label="Previous sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="dots" id="dots" role="group" aria-label="Sentences"></div>
        <button class="nav-b" id="nextBtn" aria-label="Next sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </main>
  <p class="note" id="note" role="status"></p>
  <p class="foot">Listen, then say it straight after the speaker. To record yourself and compare, go to <a href="../shadowing/">Shadowing</a>.</p>
</div>

    if (Math.abs(q1.top - q2.top) > 4) continue;
    const em = q1.height * .72, x1 = q1.right - box.left - Math.min(q1.width * .45, em * .55), x2 = q2.left - box.left + Math.min(q2.width * .45, em * .55), y = q1.bottom - box.top - q1.height * .1;
    out += `<path data-k="${k}" d="M${x1.toFixed(1)} ${y.toFixed(1)} Q${((x1 + x2) / 2).toFixed(1)} ${(y + q1.height * .45).toFixed(1)} ${x2.toFixed(1)} ${y.toFixed(1)}"/>`;
  }
  svg.innerHTML = out;
  svg.querySelectorAll('path').forEach(pa => pa.style.setProperty('--len', pa.getTotalLength() + 1));
}
function layout(){ arcsFor(sen()); if (row()._buf) wave(sen(), row()._buf, -1); }
document.fonts && document.fonts.ready.then(layout);
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

/* the real sound wave, filling in blue as it plays */
function wave(li, b, t){
  const c = li.querySelector('.wave'); if (!c || !c.clientWidth) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const d = b.getChannelData(0), gap = 6, n = Math.floor(w / gap), step = Math.max(1, Math.floor(d.length / n));
  let peak = 0; for (let i = 0; i < d.length; i += 16) peak = Math.max(peak, Math.abs(d[i]));
  for (let i = 0; i < n; i++){
    let m = 0; for (let j = 0; j < step; j += 8) m = Math.max(m, Math.abs(d[i * step + j] || 0));
    const bh = Math.max(2, Math.min(h, (m / (peak || 1)) * h));
    g.fillStyle = t >= 0 && i / n <= t / b.duration ? getComputedStyle(document.documentElement).getPropertyValue('--acc') : '#D5D3CC';
    g.fillRect(i * gap, (h - bh) / 2, 3.5, bh);
  }
}

/* audio: decode each clip once and play it whole; never cut */
let ctx = null, node = null, on = null, timer = 0;
const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
const bufs = {};
function clip(url){
  if (!bufs[url]) bufs[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => ac().decodeAudioData(b, res, rej)))
    .catch(e => { delete bufs[url]; throw e; });
  return bufs[url];
}
function stop(){
  clearInterval(timer);
  if (node){ node.onended = null; try{ node.stop(); }catch(e){} node = null; }
  if (on){
    on.querySelectorAll('.now').forEach(w => w.classList.remove('now'));
    const r = row(); if (r && r._buf) wave(on, r._buf, -1);
    on = null; btn(false);
  }
}
async function play(){
  const li = sen();
  if (on){ stop(); return; }
  stop(); $('note').textContent = '';
  const r = row(), c = ac(); c.resume();
  on = li; btn(true);
  let b;
  try{ b = await clip(src(r)); }
  catch(e){ stop(); $('note').textContent = "That clip couldn't load. Check your connection and try again."; return; }
  if (on !== li) return;
  r._buf = b;
  li.querySelectorAll('.arcs path').forEach(p => p.classList.remove('go'));
  const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination);
  s.onended = () => { if (node === s){ node = null; stop(); } };
  const t0 = c.currentTime + .03; s.start(t0); node = s;
  const T = r.t[S.voice], W = li.querySelectorAll('.w'), P = li.querySelectorAll('.arcs path');
  const tick = () => {
    const t = c.currentTime - t0;
    W.forEach((w, k) => w.classList.toggle('now', t >= T[k][0] && t < T[k][1]));
    P.forEach(p => { if (t >= T[+p.dataset.k][1] - .08) p.classList.add('go'); });
    wave(li, b, t);
  };
  tick(); timer = setInterval(tick, 30);   /* a timer, not animation frames: those pause in some embedded views */
}

function go(k){ S.f = k; S.i = 0; save(); history.replaceState(null, '', '#' + k); render(); }
function step(d){
  const n = rows().length, i = S.i + d, fi = DATA.indexOf(cur());
  if (i >= 0 && i < n){ S.i = i; save(); render(); return; }
  /* past the last sentence: on to the next feature; before the first: back to the one before */
  const nf = DATA[(fi + d + DATA.length) % DATA.length];
  S.f = nf.key; S.i = d > 0 ? 0 : nf.ex.concat(nf.real).length - 1; save(); history.replaceState(null, '', '#' + nf.key); render();
}
$('feats').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) go(b.dataset.k); });
$('stage').addEventListener('click', e => { const b = e.target.closest('[data-voice]'); if (!b) return; S.voice = b.dataset.voice; save(); render(); });
$('dots').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; S.i = +b.dataset.i; save(); render(); });
$('listenBtn').onclick = play;
$('prevBtn').onclick = () => step(-1);
$('nextBtn').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' && !e.target.closest('button,a')){ e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (DATA.some(f => f.key === h) && h !== S.f) go(h); });
render();
</script>
</body>
